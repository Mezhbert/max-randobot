# Полный прод-стек БЕЗ Cloudflare: PostgreSQL + бот + Caddy (авто-TLS).
#
# Использование на VPS с доменом:
#   cp .env.example .env  &&  отредактировать BOT_TOKEN/WEBHOOK_SECRET
#   # в .env: WEBHOOK_URL=https://bot.example.com
#   DOMAIN=bot.example.com ACME_EMAIL=you@mail.com \
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy сам выпускает и продлевает Let's Encrypt-сертификат (порты 80/443).
# Порт 8080 бота наружу не торчит (только на 127.0.0.1 — для dev-туннеля).
#
# cron-задачи запускаются встроенным тикером бота (отдельный cron-контейнер
# не обязателен; пример запуска см. в README).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: giveaway
      POSTGRES_PASSWORD: giveaway
      POSTGRES_DB: giveaway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giveaway -d giveaway"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_DSN: ${DB_DSN:-postgres://giveaway:giveaway@postgres:5432/giveaway?sslmode=disable}
      DB_MIGRATE: "true"
      TZ: Europe/Moscow
      HTTP_PORT: "8080"
    ports:
      # Наружу только с локалхоста (Caddy ходит по внутренней сети,
      # а этот маппинг — для dev-туннеля/отладки на самом сервере).
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN=bot.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
