<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подтверждение участия</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fa; color: #1c1c1e; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181d; color: #f2f2f7; } }
  .card {
    width: 100%; max-width: 360px; background: #fff; border-radius: 16px;
    padding: 24px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center;
  }
  @media (prefers-color-scheme: dark) { .card { background: #23252b; } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.sub { color: #8a8a8e; font-size: 14px; margin: 0 0 20px; }
  img.captcha {
    width: 240px; height: 80px; border-radius: 8px; border: 1px solid #d1d1d6;
    background: #fff; margin-bottom: 16px;
  }
  input {
    width: 100%; padding: 14px; font-size: 20px; text-align: center;
    letter-spacing: 6px; border-radius: 10px; border: 1px solid #d1d1d6;
    background: transparent; color: inherit; margin-bottom: 12px; outline: none;
  }
  input:focus { border-color: #7c5cff; }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 10px; background: #7c5cff; color: #fff;
    cursor: pointer; margin-bottom: 8px;
  }
  button.ghost { background: transparent; color: #7c5cff; }
  .msg { font-size: 14px; min-height: 20px; margin: 8px 0; }
  .msg.ok { color: #2e9e44; } .msg.err { color: #d64545; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="view-captcha">
    <h1>🤖 Подтвердите, что вы человек</h1>
    <p class="sub">Введите цифры с картинки, чтобы участвовать в розыгрыше</p>
    <div class="msg err hidden" id="load-err">Не удалось загрузить капчу. Закройте и нажмите «Участвовать» ещё раз.</div>
    <div id="cap-wrap" class="hidden">
      <img class="captcha" id="cap-img" alt="капча">
      <input id="answer" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <div class="msg" id="msg"></div>
      <button id="btn-ok">Подтвердить</button>
      <button class="ghost" id="btn-reload">🔄 Другая картинка</button>
    </div>
  </div>
  <div id="view-done" class="hidden">
    <h1>🎉 Вы участвуете!</h1>
    <p class="sub" id="done-name"></p>
    <p class="sub">Можно закрыть это окно. Итоги — в посте розыгрыша.</p>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  // start_param приходит как captcha_<giveaway_id> (payload open_app-кнопки).
  var sp = params.get('start_param') || '';
  var gid = params.get('giveaway_id') || (sp.indexOf('captcha_') === 0 ? sp.slice(8) : '');
  var initData = params.get('init_data') || '';
  var $ = function (id) { return document.getElementById(id); };

  if (!gid) { $('load-err').classList.remove('hidden'); return; }

  var qs = 'giveaway_id=' + encodeURIComponent(gid) + '&init_data=' + encodeURIComponent(initData);

  function load() {
    $('msg').textContent = ''; $('msg').className = 'msg';
    fetch('/app/api/captcha/start?' + qs, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) {
        $('cap-img').src = URL.createObjectURL(b);
        $('cap-wrap').classList.remove('hidden');
        $('load-err').classList.add('hidden');
        $('answer').focus();
      })
      .catch(function () { $('load-err').classList.remove('hidden'); });
  }

  function verify() {
    var answer = $('answer').value.trim();
    if (!answer) return;
    fetch('/app/api/captcha/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ giveaway_id: parseInt(gid, 10), answer: answer })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          $('view-captcha').classList.add('hidden');
          $('view-done').classList.remove('hidden');
          $('done-name').textContent = res.name ? 'Розыгрыш «' + res.name + '»' : '';
        } else {
          $('msg').textContent = res.error || 'Неверно';
          $('msg').className = 'msg err';
          load(); // одна попытка — сразу новая картинка
        }
      })
      .catch(function () {
        $('msg').textContent = 'Ошибка сети. Попробуйте снова.';
        $('msg').className = 'msg err';
      });
  }

  $('btn-ok').addEventListener('click', verify);
  $('answer').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });
  $('btn-reload').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
