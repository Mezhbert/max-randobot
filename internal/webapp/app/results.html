<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результаты розыгрыша</title>
<style>
  :root { --bg:#0f1420; --card:#1a2235; --accent:#7c5cff; --text:#e8ecf5; --muted:#8b93a7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:var(--card); border-radius:16px; padding:20px; margin-bottom:16px; }
  h1 { font-size:22px; margin-bottom:6px; }
  .status { display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; background:rgba(124,92,255,.15); color:var(--accent); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .stat { background:rgba(255,255,255,.04); border-radius:10px; padding:12px; }
  .stat .num { font-size:24px; font-weight:700; }
  .stat .lbl { font-size:12px; color:var(--muted); }
  .winners { list-style:none; }
  .winners li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .winners li:last-child { border:none; }
  .medal { font-size:20px; }
  .name { font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .err { text-align:center; padding:60px 0; color:var(--muted); }
  .skel { height:80px; border-radius:12px; background:linear-gradient(90deg,var(--card) 25%,#232d45 50%,var(--card) 75%); background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:14px; }
  @keyframes sk { to { background-position:-200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="content">
    <div class="skel"></div><div class="skel"></div><div class="skel" style="height:120px"></div>
  </div>
</div>
<script>
// MAX MiniApp передаёт initData в URL (или через window.Telegram-подобный объект).
// Наш API валидирует подпись initData на бэке и отдаёт данные розыгрыша.
const params = new URLSearchParams(location.search);
const initData = params.get('init_data') || '';
// start_param из запроса или из init_data (query-string формат) — так его
// передают open_app-кнопки (мини-апп открывается по URL из MasterBot).
let sp = params.get('start_param');
if (!sp && initData) {
  try { sp = new URLSearchParams(decodeURIComponent(initData)).get('start_param') || ''; }
  catch (e) { try { sp = new URLSearchParams(initData).get('start_param') || ''; } catch (e2) {} }
}
const gid = params.get('id') || (sp || '').replace('results_', '');

// Открыто без id (кнопка мини-аппа без параметров) — на главную с описанием.
if (!gid || !/^\d+$/.test(gid)) {
  location.replace('/app/index.html');
}

async function load() {
  try {
    const url = `/app/api/giveaway/${gid}${initData ? '?init_data=' + encodeURIComponent(initData) : ''}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch (e) {
    // Fallback: публичные данные без авторизации (если API разрешает).
    try {
      const r2 = await fetch(`/app/api/giveaway/${gid}`);
      if (!r2.ok) throw 0;
      render(await r2.json());
    } catch (_) {
      document.getElementById('content').innerHTML =
        '<div class="err">Не удалось загрузить розыгрыш.<br>Откройте из поста с результатами.</div>';
    }
  }
}

function render(d) {
  const medals = ['🥇','🥈','🥉'];
  const winners = (d.winners || []).map((w, i) =>
    `<li><span class="medal">${medals[i] || '🏅'}</span><span class="name">${esc(w.name)}</span></li>`
  ).join('') || '<li class="muted">Победители ещё не выбраны</li>';

  document.getElementById('content').innerHTML = `
    <div class="card">
      <h1>${esc(d.name)}</h1>
      <span class="status">${esc(d.status)}</span>
      <div class="stats">
        <div class="stat"><div class="num">${d.participants}</div><div class="lbl">участников</div></div>
        <div class="stat"><div class="num">${d.winners_count}</div><div class="lbl">победителей</div></div>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">🏆 Победители</div>
      <ul class="winners">${winners}</ul>
    </div>
    <div class="muted" style="text-align:center">${d.finished_at ? 'Итоги подведены: ' + esc(d.finished_at) : ''}</div>
  `;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
</script>
</body>
</html>
