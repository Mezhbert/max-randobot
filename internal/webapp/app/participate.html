<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Участие в розыгрыше</title>
<style>
  :root { --bg:#0f1420; --card:#1a2235; --accent:#7c5cff; --ok:#2e9e44; --err:#d64545; --text:#e8ecf5; --muted:#8b93a7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { width:100%; max-width:400px; background:var(--card); border-radius:18px; padding:26px 22px; text-align:center; }
  .emoji { font-size:48px; margin-bottom:10px; }
  h1 { font-size:20px; margin-bottom:6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:18px; line-height:1.5; }
  button { width:100%; padding:15px; font-size:16px; font-weight:600; border:none; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; margin-bottom:10px; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid rgba(124,92,255,.4); }
  button:disabled { opacity:.5; }
  .msg { font-size:14px; min-height:20px; margin:10px 0; color:var(--muted); }
  .msg.err { color:var(--err); }
  img.captcha { width:240px; height:80px; border-radius:8px; background:#fff; margin:10px auto; display:block; }
  input { width:200px; padding:13px; font-size:20px; text-align:center; letter-spacing:6px; border-radius:10px; border:1px solid #3a4157; background:transparent; color:var(--text); margin-bottom:12px; outline:none; }
  input:focus { border-color:var(--accent); }
  .hidden { display:none; }
  .optin { background:rgba(46,158,68,.1); border:1px solid rgba(46,158,68,.3); border-radius:12px; padding:14px; font-size:13px; color:var(--text); margin-top:12px; line-height:1.5; }
  .optin a { color:var(--accent); text-decoration:none; font-weight:600; display:inline-block; margin-top:10px; }
</style>
</head>
<body>
<div class="card">
  <!-- Экран 1: участие -->
  <div id="view-join">
    <div class="emoji">🎁</div>
    <h1 id="g-name">Розыгрыш</h1>
    <div class="sub" id="g-sub">Проверяем…</div>
    <div class="msg err hidden" id="load-err"></div>
    <div id="join-btns" class="hidden">
      <button id="btn-join">🎉 Участвовать</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- Экран 2: капча -->
  <div id="view-captcha" class="hidden">
    <div class="emoji">🤖</div>
    <h1>Подтвердите, что вы человек</h1>
    <div class="sub">Введите цифры с картинки</div>
    <img class="captcha" id="cap-img" alt="капча">
    <input id="answer" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
    <div class="msg" id="cmsg"></div>
    <button id="btn-verify">Подтвердить</button>
    <button class="ghost" id="btn-reload">🔄 Другая картинка</button>
  </div>

  <!-- Экран 3: успех -->
  <div id="view-done" class="hidden">
    <div class="emoji">🎉</div>
    <h1>Вы участвуете!</h1>
    <div class="sub" id="done-name"></div>
    <div id="optin-box" class="optin hidden">
      Хотите узнать о победе первыми?<br>Включите уведомления от бота:
      <a id="optin-link" href="#">🔔 Включить уведомления</a>
    </div>
    <button class="ghost" onclick="history.length>1?history.back():window.close()">Закрыть</button>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var initData = params.get('init_data') || '';
  var sp = params.get('start_param') || extractFromInitData(initData);
  var gid = params.get('giveaway_id') || (sp.indexOf('part_') === 0 ? sp.slice(5) : '');
  var $ = function (id) { return document.getElementById(id); };
  var needCaptcha = false;

  // start_param из init_data (query-string формат).
  function extractFromInitData(initData) {
    if (!initData) return '';
    try {
      return new URLSearchParams(decodeURIComponent(initData)).get('start_param') || '';
    } catch (e) {
      try { return new URLSearchParams(initData).get('start_param') || ''; }
      catch (e2) { return ''; }
    }
  }

  if (!gid || !/^\d+$/.test(gid)) {
    $('load-err').textContent = 'Розыгрыш не указан. Откройте из поста в канале.';
    $('load-err').classList.remove('hidden');
    return;
  }

  function show(view) {
    ['view-join', 'view-captcha', 'view-done'].forEach(function (v) {
      $(v).classList.toggle('hidden', v !== view);
    });
  }

  // Шаг 1: инфо о розыгрыше.
  fetch('/app/api/giveaway/' + gid + (initData ? '?init_data=' + encodeURIComponent(initData) : ''))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      $('g-name').textContent = d.name || 'Розыгрыш';
      if (d.status !== 'active') {
        $('g-sub').textContent = 'Розыгрыш уже не активен (' + d.status + ').';
        return;
      }
      needCaptcha = !!d.captcha;
      $('g-sub').textContent = 'Участников: ' + d.participants + ' · Победителей: ' + d.winners_count;
      $('join-btns').classList.remove('hidden');
    })
    .catch(function () {
      $('load-err').textContent = 'Не удалось загрузить. Попробуйте ещё раз.';
      $('load-err').classList.remove('hidden');
    });

  // Шаг 2: участие (с капчей или сразу).
  $('btn-join').addEventListener('click', function () {
    if (needCaptcha) { startCaptcha(); return; }
    participate();
  });

  function participate() {
    $('msg').textContent = '';
    fetch('/app/api/participate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ giveaway_id: parseInt(gid, 10) })
    })
      .then(function (r) { return r.json(); })
      .then(onResult)
      .catch(function () {
        $('msg').textContent = 'Ошибка сети. Попробуйте ещё раз.';
        $('msg').className = 'msg err';
      });
  }

  function onResult(res) {
    if (res.ok) { done(res); return; }
    if (needCaptcha && res.error && res.error.indexOf('подпишитесь') === -1) { startCaptcha(); return; }
    $('msg').textContent = res.error || 'Не удалось';
    $('msg').className = 'msg err';
  }

  // Капча.
  function startCaptcha() {
    show('view-captcha');
    loadCaptcha();
  }
  function loadCaptcha() {
    $('cmsg').textContent = '';
    fetch('/app/api/captcha/start?giveaway_id=' + gid + '&init_data=' + encodeURIComponent(initData), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.blob(); })
      .then(function (b) { $('cap-img').src = URL.createObjectURL(b); $('answer').focus(); })
      .catch(function () { $('cmsg').textContent = 'Не удалось загрузить капчу.'; $('cmsg').className = 'msg err'; });
  }
  $('btn-reload').addEventListener('click', loadCaptcha);
  $('btn-verify').addEventListener('click', verify);
  $('answer').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });

  function verify() {
    var answer = $('answer').value.trim();
    if (!answer) return;
    fetch('/app/api/captcha/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ giveaway_id: parseInt(gid, 10), answer: answer })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) { done(res); return; }
        $('cmsg').textContent = res.error || 'Неверно';
        $('cmsg').className = 'msg err';
        loadCaptcha(); // одна попытка — новая картинка
      })
      .catch(function () {
        $('cmsg').textContent = 'Ошибка сети.';
        $('cmsg').className = 'msg err';
      });
  }

  // Успех (+ opt-in уведомлений, если бот пока не может писать).
  function done(res) {
    show('view-done');
    $('done-name').textContent = res.name ? 'Розыгрыш «' + res.name + '»' : '';
    if (!res.notifiable) {
      var bot = res.bot || window.BOT_USERNAME || '';
      if (bot) {
        $('optin-link').href = 'https://max.ru/' + bot + '/start/part_' + gid;
        $('optin-box').classList.remove('hidden');
      }
    }
  }
})();
</script>
</body>
</html>
