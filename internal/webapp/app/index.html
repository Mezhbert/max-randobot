<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Открываю канал…</title>
<style>
  :root { --bg:#0f1420; --accent:#7c5cff; --text:#e8ecf5; --muted:#8b93a7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { text-align:center; padding:24px; }
  .spin { width:44px; height:44px; margin:0 auto 18px; border-radius:50%;
          border:3px solid rgba(124,92,255,.2); border-top-color:var(--accent);
          animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .t1 { font-size:16px; font-weight:600; }
  .t2 { font-size:13px; color:var(--muted); margin-top:6px; }
  .btn { display:inline-block; margin-top:18px; padding:10px 22px; border-radius:12px;
         background:var(--accent); color:#fff; text-decoration:none; font-size:14px; font-weight:600; }
  .err { display:none; }
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="sp"></div>
  <div class="t1" id="t1">Открываю канал…</div>
  <div class="t2">секундочку</div>
  <a class="btn" id="go" style="display:none" href="#">Перейти сейчас</a>
</div>
<script>
// Трекинг-редиректор мини-аппа MAX.
// Ссылка https://max.ru/<bot>?startapp=u_<code> открывает эту страницу;
// клиент MAX передаёт window.WebApp.initData (подписанный user — сервер
// валидирует и фиксирует клик с идентификацией) и start_param (код ссылки).
// После ответа сервера — мгновенный редирект в канал/пост. Чат бота НЕ открывается.
(function () {
  var api = window.WebApp || {};
  var initData = '';
  var code = '';
  try {
    initData = api.initData || '';
    code = (api.initDataUnsafe && api.initDataUnsafe.start_param) || '';
  } catch (e) {}
  if (!code) {
    // Фолбэк: start_param может прийти и query-параметром (веб-версия).
    try { code = new URLSearchParams(location.search).get('startapp') ||
                 new URLSearchParams(location.search).get('start_param') || ''; } catch (e) {}
  }
  // Формат кода: u_<hex> — префикс отрезаем, остальное серверу.
  if (code.indexOf('u_') === 0) code = code.slice(2);

  if (!code) { showFallback('Мини-апп розыгрышей'); return; }

  fetch('/app/api/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData, code: code })
  }).then(function (r) { return r.json(); }).then(function (d) {
    var dest = d && d.redirect;
    if (dest && dest.indexOf('http') === 0) {
      // В вебвью MAX внешний max.ru-адрес открывается самим клиентом.
      location.replace(dest);
      setTimeout(function () { showGo(dest); }, 1200); // если клиент не повёл сам
    } else {
      showFallback('Канал недоступен');
    }
  }).catch(function () { showFallback('Ошибка соединения'); });
})();

function showGo(dest) {
  var sp = document.getElementById('sp'); if (sp) sp.style.display = 'none';
  var t1 = document.getElementById('t1'); if (t1) t1.textContent = 'Готово!';
  var go = document.getElementById('go'); if (go) { go.href = dest; go.style.display = 'inline-block'; }
}
function showFallback(msg) {
  var sp = document.getElementById('sp'); if (sp) sp.style.display = 'none';
  var t1 = document.getElementById('t1'); if (t1) t1.textContent = msg;
}
</script>
</body>
</html>
