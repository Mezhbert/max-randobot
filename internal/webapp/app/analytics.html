<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RandoMaster</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root{--bg:#0e1117;--card:#171c28;--card2:#1f2637;--accent:#7c5cff;--accent2:#5cffb3;--err:#ff6b7a;--warn:#ffc85a;--text:#e8ecf5;--muted:#8b93a7;--line:#2a3550}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px 12px 84px}
  .hidden{display:none !important}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  header>div:first-child{flex:1}
  header .back{width:38px;height:38px;border-radius:12px;background:var(--card);border:none;color:var(--text);font-size:19px;flex:none}
  header h1{font-size:19px;font-weight:800}
  header .sub{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid transparent}
  .card.tap{cursor:pointer}.card.tap:active{background:var(--card2)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{font-size:15px;font-weight:700}
  .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .badge{font-size:10px;padding:3px 9px;border-radius:99px;background:rgba(124,92,255,.16);color:var(--accent);flex:none}
  .badge.pub{background:rgba(92,255,179,.12);color:var(--accent2)}
  .badge.contest{background:rgba(255,200,90,.15);color:var(--warn)}
  .badge.err{background:rgba(255,107,122,.14);color:var(--err)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stats.c5{grid-template-columns:repeat(5,1fr)}
  .stat{background:rgba(255,255,255,.04);border-radius:12px;padding:9px 4px;text-align:center}
  .stat .num{font-size:16px;font-weight:800}
  .stat .lbl{font-size:9.5px;color:var(--muted);margin-top:2px}
  .toolbar{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);color:var(--muted);font-size:13px;border:1px solid var(--line);cursor:pointer}
  .chip.on{background:rgba(124,92,255,.18);color:var(--accent);border-color:rgba(124,92,255,.45)}
  #f-pub .chip,#f-sub .chip,#t-ch .chip,#t-chs .chip{margin-top:6px}
  .btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:13px;border-radius:11px}
  .inp,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font-size:15px;outline:none;margin-top:6px}
  textarea{min-height:96px;resize:vertical}
  .inp:focus,textarea:focus{border-color:var(--accent)}
  label.lbl{display:block;font-size:12px;color:var(--muted);margin-top:14px;margin-bottom:2px;font-weight:600}
  .seg{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
  .seg .chip{flex:1;text-align:center;min-width:70px}
  .msg{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
  .msg.ok{color:var(--accent2)}.msg.err{color:var(--err)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:104px;margin-top:10px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:4px}
  .bar .j{background:var(--accent);border-radius:2px 2px 0 0}
  .bar .u{background:var(--err);border-radius:0 0 2px 2px;opacity:.75}
  .xaxis{display:flex;gap:2px;margin-top:4px}
  .xaxis span{flex:1;text-align:center;font-size:8px;color:var(--muted);overflow:hidden;min-width:4px}
  .skel{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
  @keyframes sk{to{background-position:-200% 0}}
  .empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px;line-height:1.5}
  .sect{font-size:12px;font-weight:700;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .user{display:flex;justify-content:space-between;padding:9px 10px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:6px;font-size:13px}
  .user .st{font-size:11px;color:var(--muted)}.user .st.in{color:var(--accent2)}.user .st.out{color:var(--err)}
  .linkline{font-size:11px;color:var(--muted);word-break:break-all;margin-top:4px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumb{position:relative;width:64px;height:64px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px}
  .thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--err);color:#fff;border:none;font-size:12px}
  #tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(14,17,23,.96);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  #tabbar .tab{flex:1;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 0}
  #tabbar .tab .ico{font-size:21px;display:block;margin-bottom:2px}
  #tabbar .tab.on{color:var(--accent)}
  .fab{position:fixed;right:16px;bottom:120px;padding:12px 18px;border-radius:16px;background:var(--accent);color:#fff;border:none;font-size:19px;font-weight:800;line-height:1.15;text-align:center;box-shadow:0 6px 22px rgba(124,92,255,.5);z-index:49;cursor:pointer;white-space:pre}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:15px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .dropdown{position:absolute;right:12px;top:56px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:210px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .dropdown .ditem{padding:10px 12px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--text)}
  .dropdown .ditem:active,.dropdown .ditem.on{background:rgba(124,92,255,.18);color:var(--accent)}
  .dropdown .dsep{font-size:10px;color:var(--muted);padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.4px}
  header{position:relative}
</style>
</head>
<body>
  <div id="app"><div class="skel"></div><div class="skel"></div><div class="skel" style="height:110px"></div></div>
  <button class="fab hidden" id="fab">＋</button>
  <nav id="tabbar" class="hidden">
    <button class="tab on" data-tab="gw"><span class="ico">🎲</span>Розыгрыши</button>
    <button class="tab" data-tab="tr"><span class="ico">🔗</span>Трекинг</button>
    <button class="tab" data-tab="ch"><span class="ico">📻</span>Каналы</button>
    <button class="tab" data-tab="me"><span class="ico">⚙️</span>Ещё</button>
  </nav>
<script>
// RandoMaster mini-app hub: всё управление — тут.
// Табы: Розыгрыши (список+создание) | Аналитика (каналы→ссылки→детали) |
// Каналы (список+добавление) | Ещё (трекинг/справка).
(function () {
  var api = window.WebApp || {};
  try { api.ready && api.ready(); } catch (e) {}
  var initData = (api.initData || '') || new URLSearchParams(location.search).get('init_data') || '';
  var backBtn = api.BackButton;

  var app = document.getElementById('app');
  var tabbar = document.getElementById('tabbar');
  var fab = document.getElementById('fab');
  var state = { tab: 'gw', sort: 'date', filter: 'all', dynDays: 14,
                gwSort: 'date', gwFilter: 'all',
                chID: null, chTitle: '', view: 'tab' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function GET(path) {
    return fetch(path + (path.indexOf('?') > -1 ? '&' : '?') + 'init_data=' + encodeURIComponent(initData))
      .then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  function POST(path, body) {
    return fetch(path + '?init_data=' + encodeURIComponent(initData), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }
  function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) + '%' : '—'; }
  function header(title, sub, canBack) {
    return '<header>' + (canBack ? '<button class="back" id="hb">←</button>' : '') +
      '<div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div></header>';
  }

  // ============ Таб 1: РОЗЫГРЫШИ ============
  function renderGiveaways() {
    state.tab = 'gw'; state.view = 'tab';
    if (backBtn) backBtn.hide();
    fab.classList.remove('hidden');
    fab.textContent = 'создать\nрозыгрыш';
    fab.onclick = function () { renderCreateGiveaway(); };
    var filterNames = { all:'Все розыгрыши', draft:'Черновики', scheduled:'Запланированные', active:'Идут сейчас', finished:'Завершённые' };
    app.innerHTML = '<header style="position:relative"><div><h1>🎲 Розыгрыши</h1></div>' +
      '<button class="iconbtn" id="gw-filter">⚙</button></header>' +
      '<div id="gw-dd"></div>' +
      '<div id="list"><div class="skel"></div><div class="skel"></div></div>';
    document.getElementById('gw-filter').onclick = function (e) {
      e.stopPropagation();
      renderGwDropdown(filterNames);
    };
    function renderGwDropdown(names) {
      var dd = document.getElementById('gw-dd');
      if (dd.innerHTML) { dd.innerHTML = ''; return; }
      var items = '';
      items += '<div class="dsep">Показать</div>';
      ['all','draft','scheduled','active','finished'].forEach(function (f) {
        items += '<div class="ditem ' + (state.gwFilter === f ? 'on' : '') + '" data-f="' + f + '">' + names[f] + '</div>';
      });
      items += '<div class="dsep">Сортировка</div>';
      items += '<div class="ditem ' + (state.gwSort === 'date' ? 'on' : '') + '" data-s="date">Сначала новые</div>';
      items += '<div class="ditem ' + (state.gwSort === 'name' ? 'on' : '') + '" data-s="name">По имени (А→Я)</div>';
      dd.innerHTML = '<div class="dropdown">' + items + '</div>';
      dd.querySelectorAll('[data-f]').forEach(function (el) {
        el.onclick = function () { state.gwFilter = el.getAttribute('data-f'); renderGiveaways(); };
      });
      dd.querySelectorAll('[data-s]').forEach(function (el) {
        el.onclick = function () { state.gwSort = el.getAttribute('data-s'); renderGiveaways(); };
      });
      setTimeout(function () {
        document.addEventListener('click', function close() { dd.innerHTML = ''; document.removeEventListener('click', close); });
      }, 10);
    }
    bind();
    GET('/app/api/analytics/giveaways').then(function (d) {
      var gws = d.giveaways || [];
      if (state.gwSort === 'name') gws.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });
      if (state.gwFilter !== 'all') gws = gws.filter(function (g) { return g.status === state.gwFilter; });
      var m = { draft:['Черновик',''], scheduled:['Запланирован','📅'], active:['Идёт','🟢'], finished:['Завершён','🏁'], cancelled:['Отменён','✖'] };
      document.getElementById('list').innerHTML = gws.map(function (g) {
        var s = m[g.status] || [g.status, ''];
        var when = g.status === 'draft' ? 'изменён ' + esc(g.when) :
                   g.status === 'scheduled' ? 'старт ' + esc(g.when) :
                   g.status === 'active' ? 'итоги ' + esc(g.when) : 'итоги ' + esc(g.when);
        return '<div class="card tap" data-a="gw" data-id="' + g.id + '">' +
          '<div class="row"><div class="title">' + esc(g.name) + '</div><span class="badge ' + (g.status === 'active' ? 'pub' : g.status === 'draft' ? '' : '') + '">' + s[1] + ' ' + s[0] + '</span></div>' +
          '<div class="meta">' + when + ' · участников: ' + g.parts + ' · победителей: ' + g.winners + '</div></div>';
      }).join('') || '<div class="empty">Пока пусто.<br>Нажмите «＋» — создайте первый розыгрыш.</div>';
      app.querySelectorAll('.card[data-a="gw"]').forEach(function (c) {
        c.onclick = function () {
          var g = gws.filter(function (x) { return String(x.id) === c.getAttribute('data-id'); })[0];
          if (g) renderGiveaway(g);
        };
      });
    }).catch(function () { document.getElementById('list').innerHTML = '<div class="empty">Не удалось загрузить.</div>'; });
  }

  function renderGiveaway(g) {
    state.view = 'detail';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    app.innerHTML = header(g.name, 'розыгрыш', true) +
      '<div class="card"><div class="stats">' +
      '<div class="stat"><div class="num">' + g.parts + '</div><div class="lbl">участников</div></div>' +
      '<div class="stat"><div class="num">' + g.winners + '</div><div class="lbl">победителей</div></div>' +
      '<div class="stat"><div class="num" style="font-size:11px;padding-top:8px">' + esc(g.when) + '</div><div class="lbl">' + esc(g.status) + '</div></div>' +
      '</div></div>' +
      '<div class="card tap" data-a="sendpost"><div class="row"><div class="title">📤 Отправить пост мне в чат</div><span>→</span></div>' +
      '<div class="meta">готовый пост точным видом (текст, медиа, кнопка)</div></div>' +
      '<div id="sendmsg" class="msg"></div>';
    if (backBtn) backBtn.onClick(function () { renderGiveaways(); });
    document.getElementById('hb').onclick = renderGiveaways;
    var sp = app.querySelector('[data-a="sendpost"]');
    sp.onclick = function () {
      sp.querySelector('.title').textContent = '⏳ Отправляю…';
      POST('/app/api/analytics/send-post', { giveaway_id: parseInt(g.id, 10) }).then(function (d) {
        var el = document.getElementById('sendmsg');
        el.textContent = d.ok ? '✅ Пост отправлен — проверьте чат с ботом' : '⚠️ ' + (d.error || 'ошибка');
        el.className = 'msg ' + (d.ok ? 'ok' : 'err');
        sp.querySelector('.title').textContent = '📤 Отправить пост мне в чат';
      });
    };
  }

  // ---------- Создание розыгрыша ----------
  function renderCreateGiveaway() {
    state.view = 'create';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    if (backBtn) backBtn.onClick(function () { renderGiveaways(); });
    app.innerHTML = header('🎁 Новый розыгрыш', 'заполните и опубликуйте', true) +
      '<label class="lbl">Текст поста *</label>' +
      '<textarea id="f-post" placeholder="🎁 РОЗЫГРЫШ!&#10;&#10;Условия простые: подпишись на каналы и нажми «Участвовать»…"></textarea>' +
      '<label class="lbl">Фото / видео (до 50 МБ)</label>' +
      '<div class="thumbs" id="f-media"></div>' +
      '<button class="btn sec sm" id="f-addmedia" style="margin-top:8px">＋ Добавить медиа</button>' +
      '<input type="file" id="f-file" accept="image/*,video/*" class="hidden">' +
      '<label class="lbl">Каналы публикации *</label><div id="f-pub"></div>' +
      '<label class="lbl">Название (для списка)</label>' +
      '<input class="inp" id="f-name" placeholder="Например: iPhone в декабре">' +
      '<label class="lbl">Каналы обязательной подписки</label><div id="f-sub"></div>' +
      '<label class="lbl">Текст кнопки участия</label>' +
      '<input class="inp" id="f-btn" placeholder="Участвовать" value="Участвовать">' +
      '<label class="lbl">Победителей (1–100)</label><input class="inp" id="f-winners" type="number" value="1" min="1" max="100">' +
      '<label class="lbl">Итоги подвести</label>' +
      '<div class="seg" id="f-finmode"><div class="chip on" data-v="time">⏰ По времени</div><div class="chip" data-v="count">👥 По числу</div></div>' +
      '<div id="f-fintime"><label class="lbl">Дата итогов (МСК), ДД.ММ.ГГГГ ЧЧ:ММ</label>' +
      '<input class="inp" id="f-finat" placeholder="' + defaultFinish() + '"></div>' +
      '<div id="f-fincount" class="hidden"><label class="lbl">Целевое число участников (от 10)</label>' +
      '<input class="inp" id="f-fincnt" type="number" placeholder="100" min="10"></div>' +
      '<label class="lbl">Старт публикации</label>' +
      '<div class="seg" id="f-pubmode"><div class="chip on" data-v="now">🚀 Сразу</div><div class="chip" data-v="at">🕐 По времени</div></div>' +
      '<div id="f-pubat-w" class="hidden"><label class="lbl">Дата публикации (МСК)</label>' +
      '<input class="inp" id="f-pubat" placeholder="ДД.ММ.ГГГГ ЧЧ:ММ"></div>' +
      '<label class="lbl">Дополнительно</label>' +
      '<div class="seg"><div class="chip on" id="f-captcha">🛡 Капча</div>' +
      '<div class="chip" id="f-referral">👥 Друзья</div>' +
      '<div class="chip on" id="f-resinpost">📍 Итоги в посте</div></div>' +
      '<label class="lbl">Сообщение победителям (необязательно)</label>' +
      '<textarea id="f-winmsg" style="min-height:64px" placeholder="Поздравляем! Напишите @manager в течение 48 часов…"></textarea>' +
      '<button class="btn" id="f-go">🚀 Создать и опубликовать</button>' +
      '<button class="btn sec" id="f-draft">💾 Сохранить черновик</button>' +
      '<div class="msg" id="f-msg"></div>';
    document.getElementById('hb').onclick = renderGiveaways;

    var media = [];
    var fileInput = document.getElementById('f-file');
    document.getElementById('f-addmedia').onclick = function () { fileInput.click(); };
    fileInput.onchange = function () {
      var f = fileInput.files[0];
      if (!f) return;
      var kind = f.type.indexOf('video') === 0 ? 'video' : 'image';
      var fd = new FormData();
      fd.append('file', f); fd.append('kind', kind);
      document.getElementById('f-addmedia').textContent = '⏳ Загрузка…';
      fetch('/app/api/upload?init_data=' + encodeURIComponent(initData), { method: 'POST', body: fd })
        .then(function (r) { return r.json(); }).then(function (d) {
          document.getElementById('f-addmedia').textContent = '＋ Добавить медиа';
          if (d.ok) { media.push({ token: d.token, type: d.type }); renderMedia(); }
          else showMsg('f-msg', d.error || 'Ошибка загрузки', true);
          fileInput.value = '';
        }).catch(function () {
          document.getElementById('f-addmedia').textContent = '＋ Добавить медиа';
          showMsg('f-msg', 'Ошибка сети при загрузке', true);
        });
    };
    function renderMedia() {
      var el = document.getElementById('f-media');
      el.innerHTML = media.map(function (m, i) {
        return '<div class="thumb">' + (m.type === 'video' ? '🎬' : '🖼') +
          '<button class="x" data-i="' + i + '">✕</button></div>';
      }).join('');
      el.querySelectorAll('.x').forEach(function (b) {
        b.onclick = function () { media.splice(parseInt(b.getAttribute('data-i'), 10), 1); renderMedia(); };
      });
    }

    var pubSel = [], subSel = [];
    GET('/app/api/analytics/channels').then(function (d) {
      var chs = (d.channels || []).filter(function (c) { return c.admin; });
      function renderPickers() {
        document.getElementById('f-pub').innerHTML = chs.map(function (c) {
          return '<div class="chip ' + (pubSel.indexOf(c.id) > -1 ? 'on' : '') + '" data-pid="' + c.id + '">' +
            (pubSel.indexOf(c.id) > -1 ? '✅ ' : '') + esc(c.title) + '</div>';
        }).join('') || '<div class="meta">Нет каналов — добавьте во вкладке «📢 Каналы»</div>';
        document.getElementById('f-sub').innerHTML = chs.map(function (c) {
          var locked = pubSel.indexOf(c.id) > -1;
          return '<div class="chip ' + (locked || subSel.indexOf(c.id) > -1 ? 'on' : '') + '" data-sid="' + c.id + '">' +
            (locked ? '🔒 ' : (subSel.indexOf(c.id) > -1 ? '✅ ' : '')) + esc(c.title) + '</div>';
        }).join('') || '<div class="meta">—</div>';
        document.querySelectorAll('[data-pid]').forEach(function (el) {
          el.onclick = function () {
            var id = parseInt(el.getAttribute('data-pid'), 10);
            var i = pubSel.indexOf(id);
            if (i > -1) { pubSel.splice(i, 1); subSel = subSel.filter(function (s) { return s !== id; }); }
            else pubSel.push(id);
            renderPickers();
          };
        });
        document.querySelectorAll('[data-sid]').forEach(function (el) {
          el.onclick = function () {
            var id = parseInt(el.getAttribute('data-sid'), 10);
            if (pubSel.indexOf(id) > -1) return;
            var i = subSel.indexOf(id);
            if (i > -1) subSel.splice(i, 1); else subSel.push(id);
            renderPickers();
          };
        });
      }
      renderPickers();
    });

    segBind('f-finmode', function (v) {
      document.getElementById('f-fintime').classList.toggle('hidden', v !== 'time');
      document.getElementById('f-fincount').classList.toggle('hidden', v !== 'count');
    });
    segBind('f-pubmode', function (v) {
      document.getElementById('f-pubat-w').classList.toggle('hidden', v !== 'at');
    });
    toggleBind('f-captcha'); toggleBind('f-referral'); toggleBind('f-resinpost');

    function collect(saveDraft) {
      var finMode = segVal('f-finmode'), pubMode = segVal('f-pubmode');
      return {
        post_text: document.getElementById('f-post').value.trim(),
        media_tokens: media,
        pub_channels: pubSel,
        sub_channels: subSel.concat(pubSel.filter(function (id) { return subSel.indexOf(id) === -1; })),
        name: document.getElementById('f-name').value.trim() || firstLine(document.getElementById('f-post').value),
        button_text: document.getElementById('f-btn').value.trim() || 'Участвовать',
        winners: parseInt(document.getElementById('f-winners').value || '1', 10) || 1,
        finish_mode: finMode,
        finish_at: finMode === 'time' ? document.getElementById('f-finat').value.trim() : '',
        finish_count: finMode === 'count' ? parseInt(document.getElementById('f-fincnt').value || '0', 10) : 0,
        publish_now: pubMode === 'now',
        publish_at: pubMode === 'at' ? document.getElementById('f-pubat').value.trim() : '',
        captcha: chipOn('f-captcha'), referral: chipOn('f-referral'),
        results_in_post: chipOn('f-resinpost'),
        winners_message: document.getElementById('f-winmsg').value.trim(),
        save_draft: !!saveDraft
      };
    }
    function submit(saveDraft) {
      var body = collect(saveDraft);
      if (!body.post_text) return showMsg('f-msg', 'Напишите текст поста', true);
      if (!body.pub_channels.length) return showMsg('f-msg', 'Выберите хотя бы один канал публикации', true);
      showMsg('f-msg', '⏳ Сохраняю…');
      POST('/app/api/giveaways/create', body).then(function (d) {
        if (d.ok) {
          showMsg('f-msg', saveDraft ? '✅ Черновик сохранён' : '✅ Розыгрыш создан! Пост уже в каналах.');
          setTimeout(renderGiveaways, 1200);
        } else showMsg('f-msg', '⚠️ ' + (d.error || 'Ошибка'), true);
      }).catch(function () { showMsg('f-msg', 'Ошибка сети', true); });
    }
    document.getElementById('f-go').onclick = function () { submit(false); };
    document.getElementById('f-draft').onclick = function () { submit(true); };
  }
  function defaultFinish() {
    var d = new Date(); d.setDate(d.getDate() + 1);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' 21:00';
  }
  function firstLine(t) { var l = t.split('\n')[0].replace(/[*#>_]+/g, '').trim(); return l.slice(0, 30); }
  function segBind(id, cb) {
    document.querySelectorAll('#' + id + ' .chip').forEach(function (c) {
      c.onclick = function () {
        document.querySelectorAll('#' + id + ' .chip').forEach(function (x) { x.classList.remove('on'); });
        c.classList.add('on');
        if (cb) cb(c.getAttribute('data-v'));
      };
    });
  }
  function segVal(id) {
    var on = document.querySelector('#' + id + ' .chip.on');
    return on ? on.getAttribute('data-v') : '';
  }
  function toggleBind(id) {
    var el = document.getElementById(id);
    if (el) el.onclick = function () { el.classList.toggle('on'); };
  }
  function chipOn(id) { var el = document.getElementById(id); return el ? el.classList.contains('on') : false; }
  function showMsg(id, text, isErr) {
    var el = document.getElementById(id);
    if (el) { el.textContent = text; el.className = 'msg ' + (isErr ? 'err' : 'ok'); }
  }

  function renderDynamics(dyn, days) {
    var el = document.getElementById('dyn');
    if (!el || !dyn || !dyn.length) { if (el) el.innerHTML = ''; return; }
    var maxJ = 1, totJ = 0, totU = 0;
    dyn.forEach(function (d) { totJ += d.Joins; totU += d.Unsubs; if (d.Joins > maxJ) maxJ = d.Joins; if (d.Unsubs > maxJ) maxJ = d.Unsubs; });
    var bars = dyn.map(function (d) {
      var hJ = Math.round(d.Joins / maxJ * 84), hU = Math.round(d.Unsubs / maxJ * 84);
      return '<div class="bar"><div class="j" style="height:' + Math.max(hJ, d.Joins > 0 ? 3 : 0) + 'px"></div>' +
        '<div class="u" style="height:' + Math.max(hU, d.Unsubs > 0 ? 3 : 0) + 'px"></div></div>';
    }).join('');
    var labels = dyn.map(function (d, i) { return '<span>' + (i % (dyn.length > 14 ? 5 : 2) === 0 ? d.Day.slice(0, 5) : '') + '</span>'; }).join('');
    el.innerHTML = '<div class="card"><div class="row"><div class="title tap" id="dyn-title" style="cursor:pointer">Динамика · ' + days + ' дней ▾</div>' +
      '<div class="meta" style="margin:0">＋' + totJ + ' <span style="opacity:.55">|</span> −' + totU + '</div></div>' +
      '<div class="bars">' + bars + '</div><div class="xaxis">' + labels + '</div>' +
      '<div class="meta" style="margin-top:6px">🟪 подписки · 🟥 отписки (МСК)</div></div>';
    var t = document.getElementById('dyn-title');
    if (t) t.onclick = function () { state.dynDays = state.dynDays === 14 ? 30 : 14; renderChannel(state.chID, state.chTitle); };
  }

  function renderLink(id) {

    GET('/app/api/analytics/link/' + id).then(function (d) {
      var l = d.link || {}, r = d.retention || {};
      var sub = document.querySelector('header .sub');
      if (sub) sub.textContent = l.Source || '';
      var cpaD = '—', cpaC = '—';
      if (l.Cost > 0 && r.Subscribed > 0) cpaD = (l.Cost / r.Subscribed).toFixed(1) + ' ₽';
      if (l.Cost > 0 && r.StillIn > 0) cpaC = (l.Cost / r.StillIn).toFixed(1) + ' ₽';
      var users = (d.subscribers || []).map(function (u) {
        var st = u.UnsubscribedAt ? '<span class="st out">отписался ' + esc(u.UnsubscribedAt) + '</span>' : '<span class="st in">подписан</span>';
        return '<div class="user"><div>' + esc(u.FirstName || ('#' + u.UserID)) + (u.Username ? ' @' + esc(u.Username) : '') +
          '<div class="st">' + esc(u.SubscribedAt) + (u.WasMember ? ' · был участником' : '') + '</div></div>' + st + '</div>';
      }).join('');
      var clickers = (d.clickers || []).filter(function (c) {
        return !(d.subscribers || []).some(function (s) { return s.UserID === c.UserID; });
      }).map(function (c) {
        return '<div class="user"><div>' + esc(c.FirstName || ('#' + c.UserID)) + (c.Username ? ' @' + esc(c.Username) : '') +
          '</div><span class="st">клик ' + esc(c.ClickedAt) + '</span></div>';
      }).join('');
      document.getElementById('body').innerHTML =
        '<div class="card"><div class="stats">' +
        '<div class="stat"><div class="num">' + fmt(l.Clicks) + '</div><div class="lbl">клики</div></div>' +
        '<div class="stat"><div class="num">' + fmt(l.Signups) + '</div><div class="lbl">подписки</div></div>' +
        '<div class="stat"><div class="num">' + fmt(r.StillIn) + '</div><div class="lbl">остались</div></div></div>' +
        '<div class="stats" style="margin-top:8px">' +
        '<div class="stat"><div class="num">' + pct(l.Signups, l.Clicks) + '</div><div class="lbl">конверсия</div></div>' +
        '<div class="stat"><div class="num">' + cpaD + '</div><div class="lbl">CPA грязный</div></div>' +
        '<div class="stat"><div class="num">' + cpaC + '</div><div class="lbl">CPA чистый</div></div></div>' +
        (l.PostRef ? '<div class="linkline">⚡ ' + esc(l.PostRef) + '</div>' : '') + '</div>' +
        '<div class="card"><div class="title" style="margin-bottom:8px">Удержание</div>' +
        '<div class="stats c5">' +
        ['1д','3д','7д','14д','30д'].map(function (k, i) {
          var v = [r.Retained1d, r.Retained3d, r.Retained7d, r.Retained14d, r.Retained30d][i];
          return '<div class="stat"><div class="num">' + v + '</div><div class="lbl">' + k + '</div></div>';
        }).join('') + '</div>' +
        '<div class="meta" style="margin-top:6px">из ' + r.Subscribed + ' подписавшихся' +
        (r.WasMemberAtClick ? ' · уже были участниками: ' + r.WasMemberAtClick : '') + '</div></div>' +
        '<div class="sect">Подписчики (' + (d.subscribers || []).length + ')</div>' +
        '<div>' + (users || '<div class="empty" style="padding:14px">Пока никто</div>') + '</div>' +
        (clickers ? '<div class="sect">Кликнули без подписки</div><div>' + clickers + '</div>' : '');
    }).catch(function () { document.getElementById('body').innerHTML = '<div class="empty">Ошибка загрузки.</div>'; });
  }

      try { if (api.openMaxLink) api.openMaxLink('https://max.ru/:share?text=' + encodeURIComponent(txt)); } catch (e) {}
    };
  }

  // ---------- Справка (внутренний экран: аппаратный «назад» не закрывает апп) ----------
  function renderHelp() {
    state.view = 'detail';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    app.innerHTML = header('📚 Справка', 'как всё работает', true) +
      '<div class="card"><div class="title">🎁 Розыгрыши</div>' +
      '<div class="meta">Создайте розыгрыш (кнопка «＋»): текст поста, фото/видео, каналы публикации и подписки, победители, время итогов. Пост выходит в каналы с кнопкой участия; бот проверяет подписки, показывает капчу, честно выбирает победителей и уведомляет их. Готовый пост можно отправить себе в чат из карточки розыгрыша.</div></div>' +
      '<div class="card"><div class="title">🔗 Трекинг</div>' +
      '<div class="meta">Ссылка на каждую закупку: кто кликнул, кто подписался, кто отписался и когда. Уникальная — ведёт на последний пост канала; Супер — на конкретный пост (только публичный канал); Конкурсная — пачкой по одному на каждый выбранный канал. Стоимость размещения считает цену подписчика (грязную и чистую).</div></div>' +
      '<div class="card"><div class="title">📢 Каналы</div>' +
      '<div class="meta">Добавляйте каналы, где бот админ (права «Читать все сообщения» и «Публиковать»). Публичные — по @username или ссылке; приватные — перешлите пост из канала боту в чат.</div></div>' +
      '<div class="card"><div class="title">📊 Показатели</div>' +
      '<div class="meta">Клики — переходы по ссылке. Подписки — вступившие в канал. Удержание — сколько подписчиков осталось через 1/3/7/14/30 дней. CPA грязный — стоимость/все подписавшиеся; чистый — стоимость/оставшиеся. Конверсия — подписки/клики.</div></div>' +
      '<div class="card"><div class="title">🆘 Поддержка</div>' +
      '<div class="meta">Вопросы и пожелания — напишите боту в чат, мы отвечаем.</div></div>';
    if (backBtn) backBtn.onClick(renderMore);
    document.getElementById('hb').onclick = renderMore;
  }

  // ---------- Создание трекинг-ссылки ----------
  function renderTrackingCreate() {
    state.view = 'create';
    if (backBtn) backBtn.show();
    app.innerHTML = header('🔗 Трекинг-ссылка', 'создание', true) +
      '<label class="lbl" style="margin-top:0">Механика</label>' +
      '<div class="seg" id="t-mode"><div class="chip on" data-v="ads">📣 Реклама</div><div class="chip" data-v="contest">🏁 Конкурс</div></div>' +
      '<div id="t-ads">' +
      '<label class="lbl">Канал</label><div id="t-ch"></div>' +
      '<label class="lbl">Название ссылки *</label>' +
      '<input class="inp" id="t-name" placeholder="Например: Реклама у Иванова">' +
      '<label class="lbl">Стоимость размещения, ₽ (посчитаем цену за подписчика)</label>' +
      '<input class="inp" id="t-cost" type="number" placeholder="1500">' +
      '<div id="t-type-w"><label class="lbl">Тип ссылки</label>' +
      '<div class="seg" id="t-type"><div class="chip on" data-v="unique">🔗 Уникальная</div><div class="chip" data-v="super">⚡ Суперссылка</div></div>' +
      '<div id="t-post-w" class="hidden"><label class="lbl">Ссылка на пост (https://max.ru/channel/post)</label>' +
      '<input class="inp" id="t-post" placeholder="https://max.ru/mychannel/42"></div></div>' +
      '</div>' +
      '<div id="t-contest" class="hidden">' +
      '<label class="lbl">Каналы конкурса (можно несколько — своя ссылка каждому)</label><div id="t-chs"></div>' +
      '<label class="lbl">Название (группы ссылок) *</label>' +
      '<input class="inp" id="t-name2" placeholder="Например: Новый год">' +
      '<div class="meta">Конкурсные ссылки ведут на последний пост канала.</div>' +
      '</div>' +
      '<button class="btn" id="t-go">✅ Создать ссылку</button>' +
      '<div class="msg" id="t-msg"></div><div id="t-result"></div>';
    if (backBtn) backBtn.onClick(renderMore);
    document.getElementById('hb').onclick = renderMore;

    var adsCh = 0, contestSel = [];
    GET('/app/api/analytics/channels').then(function (d) {
      var chs = (d.channels || []).filter(function (c) { return c.admin; });
      function renderAds() {
        if (!adsCh && chs.length) { adsCh = chs[0].id; }
        document.getElementById('t-ch').innerHTML = chs.map(function (c) {
          return '<div class="chip ' + (adsCh === c.id ? 'on' : '') + '" data-cid="' + c.id + '">' +
            (adsCh === c.id ? '✓ ' : '') + esc(c.title) + (c.is_public ? '' : ' 🔒') + '</div>';
        }).join('') || '<div class="meta">Нет каналов — добавьте во вкладке «📢 Каналы»</div>';
        document.querySelectorAll('[data-cid]').forEach(function (el) {
          el.onclick = function () { adsCh = parseInt(el.getAttribute('data-cid'), 10); renderAds(); };
        });
        var pub = chs.filter(function (c) { return c.id === adsCh; })[0];
        var typeW = document.getElementById('t-type-w');
        if (pub && !pub.is_public) { typeW.classList.add('hidden'); segSet('t-type', 'unique'); typeChanged(); }
        else { typeW.classList.remove('hidden'); }
      }
      function renderContest() {
        document.getElementById('t-chs').innerHTML = chs.map(function (c) {
          return '<div class="chip ' + (contestSel.indexOf(c.id) > -1 ? 'on' : '') + '" data-tid="' + c.id + '">' +
            (contestSel.indexOf(c.id) > -1 ? '✅ ' : '') + esc(c.title) + '</div>';
        }).join('') || '<div class="meta">Нет каналов</div>';
        document.querySelectorAll('[data-tid]').forEach(function (el) {
          el.onclick = function () {
            var id = parseInt(el.getAttribute('data-tid'), 10);
            var i = contestSel.indexOf(id);
            if (i > -1) contestSel.splice(i, 1); else contestSel.push(id);
            renderContest();
          };
        });
      }
      renderAds(); renderContest();
    });
    function segSet(id, v) {
      document.querySelectorAll('#' + id + ' .chip').forEach(function (c) {
        c.classList.toggle('on', c.getAttribute('data-v') === v);
      });
    }
    segBind('t-mode', function (v) {
      document.getElementById('t-ads').classList.toggle('hidden', v !== 'ads');
      document.getElementById('t-contest').classList.toggle('hidden', v !== 'contest');
    });
    segBind('t-type', function () { typeChanged(); });
    function typeChanged() {
      document.getElementById('t-post-w').classList.toggle('hidden', segVal('t-type') !== 'super');
    }
    typeChanged();

    document.getElementById('t-go').onclick = function () {
      var mode = segVal('t-mode');
      var body;
      if (mode === 'contest') {
        body = { mode: 'contest', channel_ids: contestSel, name: document.getElementById('t-name2').value.trim() };
        if (!body.name) return showMsg('t-msg', 'Введите название', true);
        if (!body.channel_ids.length) return showMsg('t-msg', 'Выберите каналы', true);
      } else {
        body = { mode: 'ads', channel_id: adsCh, name: document.getElementById('t-name').value.trim(),
                 cost: parseFloat(document.getElementById('t-cost').value || '0') || 0,
                 link_type: segVal('t-type'), post_ref: document.getElementById('t-post').value.trim() };
        if (!adsCh) return showMsg('t-msg', 'Выберите канал', true);
        if (!body.name) return showMsg('t-msg', 'Введите название', true);
        if (body.link_type === 'super' && !body.post_ref) return showMsg('t-msg', 'Вставьте ссылку на пост', true);
      }
      showMsg('t-msg', '⏳ Создаю…');
      POST('/app/api/tracking/create', body).then(function (d) {
        if (!d.ok) return showMsg('t-msg', '⚠️ ' + (d.error || 'ошибка'), true);
        var bot = d.bot || '';
        var links = (d.codes || []).map(function (c) { return 'https://max.ru/' + bot + '?startapp=u_' + c; });
        showMsg('t-msg', '✅ Готово!');
        document.getElementById('t-result').innerHTML =
          '<div class="card">' + links.map(function (l) {
            return '<div class="linkline" style="font-size:13px;color:var(--text)">' + esc(l) + '</div>';
          }).join('') +
          '<button class="btn sec sm" id="t-copy" style="margin-top:10px">📋 Скопировать</button></div>';
        document.getElementById('t-copy').onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(links.join('\n'));
          this.textContent = '✅ Скопировано';
        };
      });
    };
  }

  // ============ таб-бар ============
  function switchTab(tab) {
    state.tab = tab;
    tabbar.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-tab') === tab);
    });
    if (tab === 'gw') renderGiveaways();
    else if (tab === 'tr') renderTrackingTab();
    else if (tab === 'ch') renderChannelsTab();
    else renderMore();
  }
  tabbar.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () { switchTab(t.getAttribute('data-tab')); };
  });

  function bind() {
    // Фильтры/сортировки переехали в дропдауны иконок ⚙; чипы-тулбары больше
    // не рендерятся в основных списках.
  }
  function refresh() {
    if (state.view === 'detail' && state.chID) renderChannel(state.chID, state.chTitle);
    else if (state.tab === 'tr') renderTrackingTab();
    else if (state.tab === 'ch') renderChannelsTab();
  }

  tabbar.classList.remove('hidden');
  switchTab('gw');
})();
</script>
</body>
</html>
