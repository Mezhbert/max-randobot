  // Пошаговый визард ссылки: 1 канал → 2 механика+название+стоимость+тип → 3 пост (если супер)
  function renderTrWizard(step, forceAdsWithChannel) {
    state.view = 'create';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    onBack(function () { step > 0 ? gotoStep(step - 1) : goHome(); });
    var TR_FIELDS = ['t-name','t-cost','t-post','t-name2'];

    var html = roleswitch() + header('Создание ссылки', 'шаг ' + (step + 1) + ' из 3', true) + progress(step, 3) + '<div id="wz">';
    if (step === 0) html += '<label class="lbl" style="margin-top:0">Канал, на который будет вести ссылка *</label>' +
      '<div class="card tap" data-a="t-pick" style="margin-top:4px"><div class="row"><div class="title" id="t-chsum">Выбрать канал…</div><span>→</span></div></div>';
    else if (step === 1) html +=
      '<label class="lbl" style="margin-top:0">Механика</label>' +
      '<div class="seg" id="t-mode"><div class="chip on" data-v="ads">📣 Реклама</div><div class="chip" data-v="contest">🏁 Конкурс</div></div>' +
      '<div id="t-ads">' +
      '<label class="lbl">Название ссылки *</label>' +
      '<input class="inp" id="t-name" placeholder="Например: Реклама у Иванова">' +
      '<label class="lbl">Стоимость размещения, ₽ (посчитаем цену за подписчика)</label>' +
      '<input class="inp" id="t-cost" type="number" placeholder="1500">' +
      '<div id="t-type-w"><label class="lbl">Тип ссылки</label>' +
      '<div class="seg" id="t-type"><div class="chip on" data-v="unique">Уникальная (на канал)</div><div class="chip" data-v="super">Супер (на конкретный пост)</div></div></div>' +
      '</div>' +
      '<label class="lbl">Привязать к розыгрышу (общая статистика)</label>' +
      '<div class="card tap" data-a="t-gwpick" style="margin-top:4px"><div class="row"><div class="title" id="t-gwsum">Без привязки</div><span>→</span></div></div>' +
      '<div class="meta">Привязанная ссылка попадёт в общую статистику розыгрыша (карточка розыгрыша и шаг «Ссылки»).</div>' +
      '<div id="t-contest" class="hidden">' +
      '<label class="lbl">Название (для всей группы ссылок) *</label>' +
      '<input class="inp" id="t-name2" placeholder="Например: Новый год">' +
      '<div class="meta">Конкурс — люди подписываются на ваши каналы, вы выбираете победителя. Ссылки ведут на последний пост канала; под каждый канал — своя.</div></div>';
    else html +=
      '<label class="lbl" style="margin-top:0">Ссылка на пост *</label>' +
      '<input class="inp" id="t-post" placeholder="https://max.ru/mychannel/42">' +
      '<div class="meta">Скопируйте адрес поста из канала — ссылка будет вести именно на него.</div>';
    html += '</div><div class="btnrow">' +
      (step > 0 ? '<button class="btn sec" id="wz-prev">← Назад</button>' : '') +
      (step < 2 ? '<button class="btn" id="wz-next">Далее →</button>' : '') +
      '</div>' +
      (step === 2 ? '<button class="btn" id="t-go">✅ Создать ссылку</button>' : '') +
      '<div class="msg" id="t-msg"></div><div id="t-result"></div>';
    app.innerHTML = html;
    bindRoleSwitch();
    // gotoStep сохраняет целевой шаг до рендера (см. визард розыгрыша).
    function gotoStep(n) {
      persistDraft(DRAFT_TR_KEY, TR_FIELDS, { step: n });
      renderTrWizard(n);
    }
    document.getElementById('hb').onclick = function () { step > 0 ? gotoStep(step - 1) : goHome(); };
    if (step > 0) document.getElementById('wz-prev').onclick = function () { gotoStep(step - 1); };
    if (step < 2) document.getElementById('wz-next').onclick = function () { nextStep(); };

    var dd = loadDraft(DRAFT_TR_KEY) || {};
    restoreDraft(DRAFT_TR_KEY, TR_FIELDS);
    autosaveDraft(DRAFT_TR_KEY, TR_FIELDS);

    var adsCh = dd.adsCh || 0;
    GET('/app/api/analytics/channels').then(function (d) {
      var chs = (d.channels || []).filter(function (c) { return c.admin; });

      if (step === 0) {
        // Первый вход с предвыбором канала (кнопка на экране канала).
        if (forceAdsWithChannel && !adsCh) { adsCh = forceAdsWithChannel; }
        if (dd.step > 0 && dd.adsCh) { renderTrWizard(dd.step); return; }
        var by = {};
        chs.forEach(function (c) { by[c.id] = c; });
        var sum = document.getElementById('t-chsum');
        if (sum) sum.textContent = adsCh && by[adsCh] ? '✓ ' + by[adsCh].title : 'Выбрать канал…';
        var pk = app.querySelector('[data-a="t-pick"]');
        if (pk) pk.onclick = function () {
          // Список каналов — модальное окно с поиском (как в визарде розыгрыша).
          openChannelPicker({
            title: 'Канал ссылки', adminOnly: true, selected: adsCh ? [adsCh] : [],
            onDone: function (sel) {
              if (!sel.length) return;
              var c = by[sel[0]];
              if (!c) return;
              persistDraft(DRAFT_TR_KEY, TR_FIELDS, { adsCh: c.id, step: 1, isPub: c.is_public });
              renderTrWizard(1);
            }
          });
        };
      } else {
        segBind('t-mode', function (v) {
          document.getElementById('t-ads').classList.toggle('hidden', v !== 'ads');
          document.getElementById('t-contest').classList.toggle('hidden', v !== 'contest');
          persistDraft(DRAFT_TR_KEY, TR_FIELDS, { step: step, mode: v });
        });
        segBind('t-type', function (v) {
          persistDraft(DRAFT_TR_KEY, TR_FIELDS, { step: step, link_type: v });
          maybeGoPost();
        });
        // Привязка к розыгрышу: свои черновики/запланированные/идущие.
        var gwSum = document.getElementById('t-gwsum');
        var gwPick = app.querySelector('[data-a="t-gwpick"]');
        var attachedGw = dd.giveaway_id || 0;
        var gwList = [];
        if (gwSum) gwSum.textContent = dd.giveaway_name || 'Без привязки';
        if (gwPick) gwPick.onclick = function () {
          GET('/app/api/analytics/giveaways').then(function (d) {
            gwList = (d.giveaways || []).filter(function (g) {
              return g.status === 'draft' || g.status === 'scheduled' || g.status === 'active';
            });
            var wrap = document.createElement('div');
            wrap.className = 'sheetwrap';
            wrap.innerHTML = '<div class="sheet">' +
              '<div class="sh"><div class="t">Привязать к розыгрышу</div><button class="x" id="gw-x">✕</button></div>' +
              '<input class="inp" id="gw-q" placeholder="Поиск розыгрыша…">' +
              '<div class="list" id="gw-list"></div></div>';
            document.body.appendChild(wrap);
            function close() { wrap.remove(); }
            function render(q) {
              q = (q || '').toLowerCase();
              wrap.querySelector('#gw-list').innerHTML =
                '<div class="srow ' + (attachedGw === 0 ? 'on' : '') + '" data-g="0"><div><div class="l">Без привязки</div></div></div>' +
                gwList.filter(function (g) { return !q || g.name.toLowerCase().indexOf(q) > -1; })
                  .map(function (g) {
                    return '<div class="srow ' + (attachedGw === g.id ? 'on' : '') + '" data-g="' + g.id + '">' +
                      '<div><div class="l">' + (attachedGw === g.id ? '✓ ' : '') + esc(g.name) + '</div>' +
                      '<div class="m">' + esc(g.status) + '</div></div></div>';
                  }).join('');
              wrap.querySelectorAll('.srow').forEach(function (r) {
                r.onclick = function () {
                  var id = parseInt(r.getAttribute('data-g'), 10);
                  attachedGw = id;
                  var g = gwList.filter(function (x) { return x.id === id; })[0];
                  dd.giveaway_id = id;
                  dd.giveaway_name = g ? g.name : '';
                  persistDraft(DRAFT_TR_KEY, TR_FIELDS, { giveaway_id: id, giveaway_name: dd.giveaway_name, step: step });
                  if (gwSum) gwSum.textContent = id ? dd.giveaway_name : 'Без привязки';
                  close();
                };
              });
            }
            wrap.querySelector('#gw-x').onclick = close;
            wrap.onclick = function (e) { if (e.target === wrap) close(); };
            wrap.querySelector('#gw-q').oninput = function () { render(this.value); };
            render();
          });
        };
        if (dd.mode) segSet('t-mode', dd.mode);
        if (dd.link_type) segSet('t-type', dd.link_type);
        // Приватный канал: без супер-типа.
        var isPub = dd.isPub !== false;
        if (document.getElementById('t-type-w')) document.getElementById('t-type-w').classList.toggle('hidden', !isPub);
        if (!isPub) segSet('t-type', 'unique');
      }
    });

    function nextStep() {
      if (step === 0) {
        if (!adsCh) return showMsg('t-msg', 'Выберите канал', true);
        gotoStep(1); return;
      }
      if (step === 1) {
        var isSuper = (segVal('t-type') || dd.link_type || 'unique') === 'super' && dd.isPub !== false;
        if (isSuper) { gotoStep(2); return; }
        tryFinish(); return;
      }
      tryFinish();
    }
    function maybeGoPost() {
      if (step === 1 && segVal('t-type') === 'super') { setTimeout(function () { gotoStep(2); }, 150); }
    }
    var goBtn = document.getElementById('t-go');
    if (goBtn) goBtn.onclick = function () { tryFinish(); };
    function tryFinish() {
      var mode = segVal('t-mode') || dd.mode || 'ads';
      var body;
      if (mode === 'contest') {
        body = { mode: 'contest', channel_ids: [adsCh], name: (val('t-name2') || dd['t-name2'] || '') };
        if (!body.name) return showMsg('t-msg', 'Введите название', true);
      } else {
        var lt = segVal('t-type') || dd.link_type || 'unique';
        var pr = val('t-post') || dd['t-post'] || '';
        if (lt === 'super' && !pr) return showMsg('t-msg', 'Вставьте ссылку на пост (шаг 3)', true);
        body = { mode: 'ads', channel_id: adsCh, name: (val('t-name') || dd['t-name'] || ''),
                 cost: parseFloat(val('t-cost') || dd['t-cost'] || '0') || 0, link_type: lt, post_ref: pr,
                 giveaway_id: dd.giveaway_id || 0 };
        if (!body.name) return showMsg('t-msg', 'Введите название', true);
      }
      showMsg('t-msg', '⏳ Создаю…');
      POST('/app/api/tracking/create', body).then(function (d) {
        if (!d.ok) return showMsg('t-msg', '⚠️ ' + (d.error || 'ошибка'), true);
        clearDraft(DRAFT_TR_KEY);
        // Ссылка создана: визард завершён — «назад» ведёт в список, а не в форму.
        document.getElementById('hb').onclick = renderTrackingTab;
        onBack(renderTrackingTab);
        var links = (d.codes || []).map(function (c) { return 'https://max.ru/' + (d.bot || '') + '?startapp=u_' + c; });
        showMsg('t-msg', '✅ Готово!');
        document.getElementById('t-result').innerHTML =
          '<div class="card">' + links.map(function (l) {
            return '<div class="linkline" style="font-size:13px;color:var(--fg)">' + esc(l) + '</div>';
          }).join('') + '<button class="btn sec sm" id="t-copy" style="margin-top:10px">📋 Скопировать</button></div>';
        document.getElementById('t-copy').onclick = function () {
          if (navigator.clipboard) navigator.clipboard.writeText(links.join('\n'));
          this.textContent = '✅ Скопировано';
        };
      });
    }
    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  }

  // ---------- Канал: ссылки + динамика + создать для этого канала ----------
  function renderChannel(id, title) {
    state.view = 'detail'; state.chID = id; state.chTitle = title;
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    onBack(renderTrackingTab);
    var fn = { all:'Все ссылки', unique:'Уникальные', super:'Суперссылки', contest:'Конкурсные' };
    app.innerHTML = roleswitch() +
      '<header style="position:relative"><button class="back" id="hb">←</button><div><h1>' + esc(title) + '</h1></div>' + filterBtn('ch-filter') + '</header>' +
      '<div id="ch-dd"></div>' +
      '<button class="btn" id="ch-newlink" style="margin-bottom:12px">＋ Создать ссылку для этого канала</button>' +
      '<div id="dyn"></div><div class="sect">Ссылки</div><div id="list"><div class="skel"></div></div>';
    bindRoleSwitch();
    document.getElementById('hb').onclick = renderTrackingTab;
    document.getElementById('ch-newlink').onclick = function () {
      persistDraft(DRAFT_TR_KEY, ['t-name','t-cost','t-post','t-name2'], { adsCh: id, step: 0 });
      renderTrWizard(1);
    };
    document.getElementById('ch-filter').onclick = function (e) {
      e.stopPropagation();
      var dd = document.getElementById('ch-dd');
      if (dd.innerHTML) { ddClose(dd); return; }
      var items = '<div class="dsep">Тип ссылок</div>';
      ['all','unique','super','contest'].forEach(function (f) {
        items += '<div class="ditem ' + (state.filter === f ? 'on' : '') + '" data-f="' + f + '">' + fn[f] + '</div>';
      });
      items += '<div class="dsep">Сортировка</div>';
      items += '<div class="ditem ' + (state.sort === 'date' ? 'on' : '') + '" data-s="date">Сначала новые</div>';
      items += '<div class="ditem ' + (state.sort === 'name' ? 'on' : '') + '" data-s="name">По имени (А→Я)</div>';
      dd.innerHTML = '<div class="dropdown">' + items + '</div>';
      dd.querySelectorAll('[data-f]').forEach(function (el) { el.onclick = function () { state.filter = el.getAttribute('data-f'); renderChannel(state.chID, state.chTitle); }; });
      dd.querySelectorAll('[data-s]').forEach(function (el) { el.onclick = function () { state.sort = el.getAttribute('data-s'); renderChannel(state.chID, state.chTitle); }; });
      ddBind(dd);
    };
    GET('/app/api/analytics/channel/' + id + '?sort=' + (state.sort === 'name' ? 'name' : 'date'))
      .then(function (d) {
        var dyn = (d.dynamics || []).slice(-state.dynDays);
        renderDynamics(dyn, state.dynDays);
        var links = d.links || [];
        if (state.filter !== 'all') links = links.filter(function (l) { return l.type === state.filter; });
        var tm = { unique:'Уникальная', super:'Супер', contest:'Конкурсная' };
        // Группировка по розыгрышам: карточка розыгрыша (общая стата по его
        // ссылкам в ЭТОМ канале), внутри — ссылки с разбивкой по источникам.
        var groups = {}, order = [];
        links.forEach(function (l) {
          var k = l.giveaway_id || 0;
          if (!groups[k]) { groups[k] = { name: l.giveaway_name || '', links: [], clicks: 0, signups: 0 }; order.push(k); }
          groups[k].links.push(l);
          groups[k].clicks += l.clicks || 0;
          groups[k].signups += l.signups || 0;
        });
        document.getElementById('list').innerHTML = order.map(function (k) {
          var gr = groups[k];
          if (k === 0) {
            // Без розыгрыша — как раньше, плоско.
            return gr.links.map(function (l) {
              return '<div class="card tap" data-a="link" data-id="' + l.id + '">' +
                '<div class="row"><div class="title">' + esc(l.name) + '</div><span class="badge ' + (l.type === 'contest' ? 'inv' : '') + '">' + (tm[l.type] || l.type) + '</span></div>' +
                (l.post_ref ? '<div class="linkline">⚡ ' + esc(l.post_ref) + '</div>' : '') +
                '<div class="stats">' +
                '<div class="stat"><div class="num">' + fmt(l.clicks) + '</div><div class="lbl">клики</div></div>' +
                '<div class="stat"><div class="num">' + fmt(l.signups) + '</div><div class="lbl">подписки</div></div>' +
                '<div class="stat"><div class="num">' + fmt(l.still_in) + '</div><div class="lbl">остались</div></div></div></div>';
            }).join('');
          }
          return '<div class="card" style="background:var(--card2)">' +
            '<div class="row"><div class="title">🎁 ' + esc(gr.name || ('Розыгрыш #' + k)) + '</div>' +
            '<span class="badge inv">' + gr.links.length + ' ссыл.</span></div>' +
            '<div class="stats">' +
            '<div class="stat"><div class="num">' + fmt(gr.clicks) + '</div><div class="lbl">клики (всего)</div></div>' +
            '<div class="stat"><div class="num">' + fmt(gr.signups) + '</div><div class="lbl">подписки (всего)</div></div>' +
            '<div class="stat"><div class="num">' + Math.round(gr.signups / (gr.clicks || 1) * 100) + '%</div><div class="lbl">конверсия</div></div></div>' +
            gr.links.map(function (l) {
              return '<div class="card tap" data-a="link" data-id="' + l.id + '" style="margin-top:8px">' +
                '<div class="row"><div class="title" style="font-size:13.5px">' + esc(l.name) + '</div>' +
                '<span class="badge">' + (tm[l.type] || l.type) + '</span></div>' +
                '<div class="meta">' + fmt(l.clicks) + ' кликов · ' + fmt(l.signups) + ' подписок · ' + fmt(l.still_in) + ' остались</div></div>';
            }).join('') + '</div>';
        }).join('') || '<div class="empty">Ссылок этого типа нет</div>';
        app.querySelectorAll('.card[data-a="link"]').forEach(function (c) {
          c.onclick = function (e) { renderLink(parseInt(c.getAttribute('data-id'), 10)); };
        });
      });
  }

  function renderDynamics(dyn, days) {
    var el = document.getElementById('dyn');
    if (!el || !dyn || !dyn.length) { if (el) el.innerHTML = ''; return; }
    var maxJ = 1, totJ = 0, totU = 0;
    dyn.forEach(function (d) { totJ += d.Joins; totU += d.Unsubs; if (d.Joins > maxJ) maxJ = d.Joins; if (d.Unsubs > maxJ) maxJ = d.Unsubs; });
    var bars = dyn.map(function (d) {
      var hJ = Math.round(d.Joins / maxJ * 80), hU = Math.round(d.Unsubs / maxJ * 80);
      return '<div class="bar"><div class="j" style="height:' + Math.max(hJ, d.Joins > 0 ? 3 : 0) + 'px"></div>' +
        '<div class="u" style="height:' + Math.max(hU, d.Unsubs > 0 ? 3 : 0) + 'px"></div></div>';
    }).join('');
    var labels = dyn.map(function (d, i) { return '<span>' + (i % (dyn.length > 14 ? 5 : 2) === 0 ? d.Day.slice(0, 5) : '') + '</span>'; }).join('');
    el.innerHTML = '<div class="card"><div class="row"><div class="title tap" id="dyn-title" style="cursor:pointer">Динамика · ' + days + ' дней ▾</div>' +
      '<div class="meta" style="margin:0">＋' + totJ + ' <span style="opacity:.55">|</span> −' + totU + '</div></div>' +
      '<div class="bars">' + bars + '</div><div class="xaxis">' + labels + '</div></div>';
    var t = document.getElementById('dyn-title');
    if (t) t.onclick = function () { state.dynDays = state.dynDays === 14 ? 30 : 14; renderChannel(state.chID, state.chTitle); };
  }

  function renderLink(id) {
    state.view = 'detail';
    if (backBtn) backBtn.show();
    onBack(function () { renderChannel(state.chID, state.chTitle); });
    app.innerHTML = roleswitch() + header('Статистика ссылки', '', true) + '<div id="body"><div class="skel"></div></div>';
    bindRoleSwitch();
    document.getElementById('hb').onclick = function () { renderChannel(state.chID, state.chTitle); };
    GET('/app/api/analytics/link/' + id).then(function (d) {
      var l = d.link || {}, r = d.retention || {};
      var subEl = document.querySelector('header .sub');
      if (subEl) subEl.textContent = l.Source || '';
      var cpaD = '—', cpaC = '—';
      if (l.Cost > 0 && r.Subscribed > 0) cpaD = (l.Cost / r.Subscribed).toFixed(1) + ' ₽';
      if (l.Cost > 0 && r.StillIn > 0) cpaC = (l.Cost / r.StillIn).toFixed(1) + ' ₽';
      var users = (d.subscribers || []).map(function (u) {
        var st = u.UnsubscribedAt ? '<span class="st" style="color:#c66">отписался ' + esc(u.UnsubscribedAt) + '</span>' : '<span class="st">подписан</span>';
        return '<div class="user"><div>' + esc(u.FirstName || ('#' + u.UserID)) + (u.Username ? ' @' + esc(u.Username) : '') +
          '<div class="st">' + esc(u.SubscribedAt) + (u.WasMember ? ' · был участником' : '') + '</div></div>' + st + '</div>';
      }).join('');
      var clickers = (d.clickers || []).filter(function (c) {
        return !(d.subscribers || []).some(function (s) { return s.UserID === c.UserID; });
      }).map(function (c) {
        return '<div class="user"><div>' + esc(c.FirstName || ('#' + c.UserID)) + '</div><span class="st">клик ' + esc(c.ClickedAt) + '</span></div>';
      }).join('');
      document.getElementById('body').innerHTML =
        '<div class="card"><div class="title" style="margin-bottom:2px;word-break:break-word">' + esc(l.Source || 'Ссылка') + '</div><div class="stats">' +
        '<div class="stat"><div class="num">' + fmt(l.Clicks) + '</div><div class="lbl">клики</div></div>' +
        '<div class="stat"><div class="num">' + fmt(l.Signups) + '</div><div class="lbl">подписки</div></div>' +
        '<div class="stat"><div class="num">' + fmt(r.StillIn) + '</div><div class="lbl">остались</div></div></div>' +
        '<div class="stats" style="margin-top:8px">' +
        '<div class="stat"><div class="num">' + pct(l.Signups, l.Clicks) + '</div><div class="lbl">конверсия</div></div>' +
        '<div class="stat"><div class="num">' + cpaD + '</div><div class="lbl">CPA грязный</div></div>' +
        '<div class="stat"><div class="num">' + cpaC + '</div><div class="lbl">CPA чистый</div></div></div>' +
        (l.PostRef ? '<div class="linkline">⚡ ' + esc(l.PostRef) + '</div>' : '') + '</div>' +
        '<div class="card tap" data-a="dellink"><div class="row"><div class="title" style="color:#c66">🗑 Удалить ссылку</div><span>→</span></div>' +
        '<div class="meta">ссылка исчезнет вместе со всей её статистикой</div></div><div class="msg" id="del-msg"></div>' +
        '<div class="card"><div class="title" style="margin-bottom:8px">Удержание</div>' +
        '<div class="stats c5">' +
        ['1д','3д','7д','14д','30д'].map(function (k, i) {
          var v = [r.Retained1d, r.Retained3d, r.Retained7d, r.Retained14d, r.Retained30d][i];
          return '<div class="stat"><div class="num">' + v + '</div><div class="lbl">' + k + '</div></div>';
        }).join('') + '</div>' +
        '<div class="meta" style="margin-top:6px">из ' + r.Subscribed + ' подписавшихся' +
        (r.WasMemberAtClick ? ' · уже были участниками: ' + r.WasMemberAtClick : '') + '</div></div>' +
        '<div class="sect">Подписчики (' + (d.subscribers || []).length + ')</div>' +
        '<div>' + (users || '<div class="empty" style="padding:14px">Пока никто</div>') + '</div>' +
        (clickers ? '<div class="sect">Кликнули без подписки</div><div>' + clickers + '</div>' : '');
      var del = app.querySelector('[data-a="dellink"]');
      if (del) del.onclick = function () {
        // confirm() в вебвью MAX недоступен — двухтаповое подтверждение.
        if (!del.classList.contains('armed')) {
          del.classList.add('armed');
          var tt = del.querySelector('.title');
          if (tt) tt.textContent = '🗑 Удалить окончательно?';
          return;
        }
        POST('/app/api/analytics/link/delete', { link_id: id }).then(function (d) {
          if (d.ok) renderChannel(state.chID, state.chTitle);
          else { var m = document.getElementById('del-msg'); if (m) { m.textContent = '⚠️ ' + (d.error || 'ошибка'); m.className = 'msg err'; } }
        });
      };
    });
  }

  // ---------- Каналы ----------
  function renderChannelsTab() {
    state.tab = 'ch'; state.view = 'tab';
    organizerTabs();
    fab.classList.add('hidden');
    app.innerHTML = roleswitch() + header('Мои каналы', '', true) +
      '<div class="card"><label class="lbl" style="margin-top:0">Ссылка на канал (@username или https://max.ru/...)</label>' +
      '<input class="inp" id="ch-link" placeholder="@mychannel, ссылка или числовой ID">' +
      '<button class="btn" id="ch-add">＋ Подключить канал</button><div class="msg" id="ch-msg"></div>' +
      '<div class="meta">Перед этим добавьте бота админом в канал (права «Читать все сообщения» и «Публиковать, редактировать и удалять сообщения»). Приватный канал — перешлите пост из канала боту в чат.</div></div>' +
      '<div id="list"><div class="skel"></div></div>';
    bindRoleSwitch();
    document.getElementById('hb').onclick = goHome;
    document.getElementById('ch-add').onclick = function () {
      var link = document.getElementById('ch-link').value.trim();
      if (!link) return showMsg('ch-msg', 'Введите ссылку', true);
      showMsg('ch-msg', '⏳ Проверяю…');
      POST('/app/api/channels/add', { link: link }).then(function (d) {
        if (d.ok && d.instruction) {
          // Подключение через событие: бота делают админом — канал появится сам.
          var m = document.getElementById('ch-msg');
          m.textContent = d.instruction;
          m.className = 'msg ok';
          m.style.whiteSpace = 'pre-line';
          document.getElementById('ch-link').value = '';
          loadList();
          return;
        }
        if (d.ok) { showMsg('ch-msg', '✅ Канал «' + esc(d.title) + '» подключён'); document.getElementById('ch-link').value = ''; loadList(); }
        else showMsg('ch-msg', '⚠️ ' + (d.error || 'ошибка'), true);
      });
    };
    function loadList() {
      GET('/app/api/analytics/channels').then(function (d) {
        var chs = d.channels || [];
        if (state.sort === 'name') chs.sort(function (a, b) { return a.title.localeCompare(b.title, 'ru'); });
        document.getElementById('list').innerHTML = chs.map(function (c) {
          return '<div class="card tap" data-a="ch" data-id="' + c.id + '" data-t="' + esc(c.title) + '">' +
            '<div class="row"><div class="title">' + esc(c.title) + '</div><span style="display:flex;align-items:center;gap:6px">' +
            '<span class="badge ' + (c.admin ? 'ok' : 'warn') + '">' + (c.admin ? 'бот админ' : 'нет прав') + '</span>' +
            '<button class="delico" data-a="chdel" data-id="' + c.id + '" title="Удалить канал">🗑</button></span></div>' +
            '<div class="meta">ссылок: ' + c.links + ' · добавлен ' + esc(c.added_at) + '</div></div>';
        }).join('') || '<div class="empty">Каналов пока нет</div>';
        app.querySelectorAll('button[data-a="chdel"]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation(); // не открывать канал
            // confirm() в вебвью недоступен — двухтаповое подтверждение.
            // Первый тап — «точно?» (темнеет), второй — удаляет.
            if (!b.classList.contains('armed')) {
              b.classList.add('armed');
              b.style.background = '#8e2020';
              b.title = 'Удалить канал окончательно?';
              return;
            }
            POST('/app/api/channels/delete', { channel_id: parseInt(b.getAttribute('data-id'), 10) })
              .then(function (d) {
                if (d.ok) { loadList(); return; }
                b.classList.remove('armed');
                b.style.background = '';
                b.title = 'Удалить канал';
                showMsg('ch-msg', '⚠️ ' + (d.error || 'ошибка'), true);
              });
          };
        });
        app.querySelectorAll('.card[data-a="ch"]').forEach(function (el) {
          el.onclick = function () { state.tab = 'tr'; renderChannel(parseInt(el.getAttribute('data-id'), 10), el.getAttribute('data-t')); };
        });
      });
    }
    loadList();
  }

      '<div class="tile t2x tap" data-t="create"><span class="tico">🎁</span><span class="tlbl">Создать розыгрыш</span><span class="tsub">пошаговый мастер · пост, каналы, итоги</span></div>' +
      '<div class="tile t2x tap" data-t="gw"><span class="tico">📋</span><span class="tlbl">Мои розыгрыши</span><span class="tsub">список, статусы, участники</span></div>' +
      '<div class="tile t2x tap" data-t="tr"><span class="tico">🔗</span><span class="tlbl">Трекинг</span><span class="tsub">ссылки на закупки, конверсии</span></div>' +
      '<div class="tile t2x tap" data-t="an"><span class="tico">📊</span><span class="tlbl">Аналитика</span><span class="tsub">каналы, клики, удержание</span></div>' +
      '<div class="tile tw tap" data-t="ch"><span class="tico">📢</span><span class="tlbl">Мои каналы</span><span class="tsub">подключение и права бота</span></div>' +
      '<div class="tile tap" data-t="mine"><span class="tico">🎟</span><span class="tlbl">Мои участия</span></div>' +
      '<div class="tile tap" data-t="support"><span class="tico">🆘</span><span class="tlbl">Поддержка</span></div>' +
      '</div><div class="msg" id="home-msg"></div>';
    bindThemeBtn('th');
    app.querySelectorAll('.tile').forEach(function (t) {
      t.onclick = function () {
        slideDir = 1; // проваливание в плитку — слайд вправо
        var a = t.getAttribute('data-t');
        if (a === 'create') { renderGwWizard(0); return; }
        if (a === 'mine') { setRole('participant'); state.tab = 'mine'; render(); return; }
        if (a === 'support') { startSupport(document.getElementById('home-msg')); return; }
        state.an = (a === 'an');
        state.tab = state.an ? 'tr' : a;
        state.view = 'tab';
        render();
      };
    });
    animateSlide(); // вход/возврат домой — тоже со слайдом (goHome задаёт направление)
  }

  // Возврат на домашний экран — со слайдом влево.
  function goHome() { slideDir = -1; renderHome(); }
  function startSupport(el) {
    if (el) { el.textContent = '⏳ Открываю поддержку…'; el.className = 'msg ok'; }
    fetch('/app/api/support/start?init_data=' + encodeURIComponent(initData), { method: 'POST' })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          try { if (api.openMaxLink) api.openMaxLink('https://max.ru/'); } catch (e) {}
          if (el) el.textContent = '✅ Бот написал вам в чат — продолжите там';
        } else if (el) { el.textContent = '⚠️ Не получилось, попробуйте позже'; el.className = 'msg err'; }
      }).catch(function () { if (el) { el.textContent = '⚠️ Ошибка сети'; el.className = 'msg err'; } });
  }

  // ---------- Роутер ----------
  function render() {
    if (role === 'participant') { tabbar.classList.remove('hidden'); renderParticipant(); animateSlide(); return; }
    if (state.view === 'home') { renderHome(); animateSlide(); return; }
    renderOrganizer();
    animateSlide();
  }
  render();
})();

</script>
</body>
</html>
