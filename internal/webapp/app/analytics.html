<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RandoMaster</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  /* ЧБ-палитра: чистая градация серого + две темы (тёмная по умолчанию). */
  :root{
    --bg:#0d0d0d; --card:#171717; --card2:#222; --fg:#f2f2f2; --muted:#999;
    --line:#333; --inv:#fff; --inv-fg:#111; --ok:#fff;
  }
  [data-theme="light"]{
    --bg:#f5f5f5; --card:#fff; --card2:#eee; --fg:#111; --muted:#777;
    --line:#ddd; --inv:#111; --inv-fg:#fff; --ok:#111;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  body{background:var(--bg);color:var(--fg);min-height:100vh;padding:10px 12px 96px;transition:background .2s,color .2s}
  .hidden{display:none !important}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  header>div{flex:1}
  header .back{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:19px;flex:none}
  header h1{font-size:19px;font-weight:800;letter-spacing:.2px}
  header .sub{font-size:12px;color:var(--muted)}
  /* Верхний свитч участникам|организаторам */
  .roleswitch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .roleswitch button{flex:1;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;padding:9px 0;border-radius:9px;cursor:pointer}
  .roleswitch button.on{background:var(--inv);color:var(--inv-fg)}
  /* Прогресс-бар: кирпичики ▰▱ */
  .progress{display:flex;gap:4px;margin:2px 0 14px}
  .progress span{flex:1;height:8px;border-radius:3px;background:var(--line)}
  .progress span.f{background:var(--fg)}
  .steptitle{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:var(--card2)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .title{font-size:15px;font-weight:700}
  .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .badge{font-size:10px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);flex:none}
  .badge.inv{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
  .badge.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
  .badge.warn{background:#f9a825;color:#222;border-color:#f9a825}
  .delico{flex:none;width:28px;height:22px;border-radius:7px;background:#c66;color:#fff;border:none;font-size:12px;cursor:pointer;line-height:1}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stats.c5{grid-template-columns:repeat(5,1fr)}
  .stat{background:var(--card2);border-radius:11px;padding:9px 4px;text-align:center}
  .stat .num{font-size:16px;font-weight:800}
  .stat .lbl{font-size:9.5px;color:var(--muted);margin-top:2px}
  .toolbar{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);color:var(--muted);font-size:13px;border:1px solid var(--line);cursor:pointer}
  .chip.on{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
  .pick .chip{margin-top:6px}
  /* Кнопки */
  .btn{display:block;width:100%;padding:14px;border-radius:13px;background:var(--inv);color:var(--inv-fg);border:none;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
  .btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
  .btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:13px;border-radius:10px}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow .btn{margin-top:0;flex:1}
  /* Визард: Назад/Далее закреплены внизу (как кнопка создания); контент выше */
  .wznav{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:49}
  .wznav .btn{margin-top:0;flex:1}
  #wz{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  /* Текст поста — на всё свободное место (навигация больше не занимает низ формы) */
  #f-post{height:calc(100vh - 300px);height:calc(100dvh - 300px);min-height:230px;resize:none}
  .createbar{position:fixed;left:12px;right:12px;bottom:92px;padding:13px;border-radius:13px;background:var(--inv);color:var(--inv-fg);border:none;font-size:15px;font-weight:800;cursor:pointer;z-index:49;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  .inp,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--fg);padding:12px;font-size:15px;outline:none;margin-top:6px}
  textarea{min-height:90px;resize:vertical}
  .inp:focus,textarea:focus{border-color:var(--fg)}
  label.lbl{display:block;font-size:12px;color:var(--muted);margin-top:13px;margin-bottom:2px;font-weight:700}
  .seg{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
  .seg .chip{flex:1;text-align:center;min-width:70px}
  .msg{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
  .msg.ok{color:var(--fg);font-weight:600}.msg.err{color:#c66}
  /* Панель форматирования (ж/к/ссылка) */
  .fmtbar{display:flex;gap:6px;margin-top:6px}
  .fmtbar button{width:38px;height:36px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--fg);font-size:14px;cursor:pointer;font-weight:800}
  .bars{display:flex;align-items:flex-end;gap:2px;height:100px;margin-top:10px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:4px}
  .bar .j{background:var(--fg);border-radius:2px 2px 0 0}
  .bar .u{background:#888;border-radius:0 0 2px 2px;opacity:.6}
  .xaxis{display:flex;gap:2px;margin-top:4px}
  .xaxis span{flex:1;text-align:center;font-size:8px;color:var(--muted);overflow:hidden;min-width:4px}
  .skel{height:70px;border-radius:14px;background:var(--card);margin-bottom:10px;animation:sk 1.2s infinite}
  @keyframes sk{50%{opacity:.55}}
  .empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px;line-height:1.5}
  .sect{font-size:12px;font-weight:800;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .user{display:flex;justify-content:space-between;padding:9px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13px}
  .user .st{font-size:11px;color:var(--muted)}
  .linkline{font-size:11px;color:var(--muted);word-break:break-all;margin-top:4px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumb{position:relative;width:64px;height:64px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
  .thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#c66;color:#fff;border:none;font-size:12px}
  .dropdown{position:absolute;right:12px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:6px;min-width:210px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .dropdown .ditem{padding:10px 12px;border-radius:9px;font-size:14px;cursor:pointer}
  .dropdown .ditem.on{background:var(--inv);color:var(--inv-fg)}
  .dropdown .dsep{font-size:10px;color:var(--muted);padding:6px 12px 2px;text-transform:uppercase;letter-spacing:.4px}
  .iconbtn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
  .iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
  /* Версия с плитками (ui-v2): домашний экран — сетка плиток, нижних табов нет */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:5px;min-height:96px;cursor:pointer}
  .tile:active{background:var(--card2)}
  .tile .tico{font-size:26px;line-height:1}
  .tile .tlbl{font-size:13.5px;font-weight:800;line-height:1.25}
  .tile .tsub{font-size:10.5px;color:var(--muted);line-height:1.3}
  .tile.t2x{min-height:206px}
  .tile.tw{grid-column:1/-1;min-height:74px}
  body{padding-bottom:20px}
  .createbar{bottom:calc(16px + env(safe-area-inset-bottom))}
  #tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  #tabbar .tab{flex:1;background:none;border:none;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 0}
  #tabbar .tab .ico{font-size:20px;display:block;margin-bottom:2px}
  #tabbar .tab.on{color:var(--fg)}
  /* Модальные пикеры (каналы с поиском, вшить ссылку) */
  .sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);border-radius:18px 18px 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom));animation:sheetUp .2s ease}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sheet .sh .t{font-size:16px;font-weight:800}
  .sheet .sh .x{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;width:34px;height:30px;font-size:14px}
  .sheet .list{overflow-y:auto;flex:1;margin-top:6px}
  .sheet .srow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 10px;border:1px solid var(--line);background:var(--card);border-radius:11px;margin-bottom:6px;cursor:pointer}
  .sheet .srow.on{background:var(--inv);color:var(--inv-fg);border-color:var(--inv)}
  .sheet .srow .l{font-size:14px;font-weight:700}
  .sheet .srow .m{font-size:11px;opacity:.7;word-break:break-all}

  /* Активный таб — подложка-пилюля (не только текст); смена таба — слайд */
  #tabbar .tab{border-radius:12px;margin:0 2px;padding:6px 0;transition:background .18s,color .18s}
  #tabbar .tab.on{background:var(--inv);color:var(--inv-fg)}
  @keyframes slideR{from{transform:translateX(46px);opacity:.3}to{transform:translateX(0);opacity:1}}
  @keyframes slideL{from{transform:translateX(-46px);opacity:.3}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
  <div id="app"><div class="skel"></div><div class="skel"></div></div>
  <button class="createbar hidden" id="fab"></button>
  <nav id="tabbar" class="hidden"></nav>

<script>
// Клиентский роутер start_param (дублирует серверный — надёжнее в мобильном
// клиенте): участиe/итоги/трекинг-клик/роль участника.
(function () {
  var api = window.WebApp || {};
  try { api.ready && api.ready(); } catch (e) {}
  var sp = '';
  try { sp = (api.initDataUnsafe && api.initDataUnsafe.start_param) || ''; } catch (e) {}
  if (!sp) {
    try { sp = new URLSearchParams(location.search).get('startapp') ||
               new URLSearchParams(location.search).get('start_param') || ''; } catch (e) {}
  }
  if (!sp) return;
  if (sp === 'participant') {
    // Кнопка «Приложение для участников» — открываем секцию участников.
    try { localStorage.setItem('rm_role', 'participant'); } catch (e) {}
    return;
  }
  if (sp.indexOf('analytics') === 0) {
    // Кнопка «Приложение для организаторов» — секция организаторов.
    try { localStorage.setItem('rm_role', 'organizer'); } catch (e) {}
    return;
  }
  if (sp.indexOf('part_') === 0 || sp.indexOf('g_') === 0) {
    location.replace('/app/participate.html?start_param=' + encodeURIComponent(sp) +
      '&init_data=' + encodeURIComponent(api.initData || '')); return;
  }
  if (sp.indexOf('results_') === 0 || sp.indexOf('r_') === 0) {
    location.replace('/app/results.html?start_param=' + encodeURIComponent(sp)); return;
  }
  if (sp.indexOf('u_') === 0) {
    document.body.innerHTML = '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0d0d0d;color:#f2f2f2;font-family:-apple-system,sans-serif"><div style="width:44px;height:44px;border-radius:50%;border:3px solid #333;border-top-color:#f2f2f2;animation:r .8s linear infinite"></div><div id="t1" style="font-size:16px;font-weight:600">Открываю канал…</div><a id="go" style="display:none;padding:10px 22px;border-radius:12px;background:#f2f2f2;color:#111;text-decoration:none;font-size:14px;font-weight:600">Перейти сейчас</a></div><style>@keyframes r{to{transform:rotate(360deg)}}</style>';
    var code = sp.slice(2);
    fetch('/app/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: (window.WebApp && window.WebApp.initData) || '', code: code })
    }).then(function (r) { return r.json(); }).then(function (d) {
      var dest = d && d.redirect;
      if (dest && dest.indexOf('http') === 0) {
        location.replace(dest);
        setTimeout(function () {
          var g = document.getElementById('go'); if (g) { g.href = dest; g.style.display = 'inline-block'; }
        }, 1200);
      } else {
        var t = document.getElementById('t1'); if (t) t.textContent = 'Канал недоступен';
      }
    }).catch(function () {
      var t = document.getElementById('t1'); if (t) t.textContent = 'Ошибка соединения';
    });
    throw new Error('track-redirect');
  }
})();
</script>
<script>
(function () {
  var api = window.WebApp || {};
  try { api.ready && api.ready(); } catch (e) {}
  var initData = (api.initData || '') || new URLSearchParams(location.search).get('init_data') || '';
  var backBtn = api.BackButton;

  var app = document.getElementById('app');
  var tabbar = document.getElementById('tabbar');
  var fab = document.getElementById('fab');

  // ------- Тема: ЧБ dark/light, сохранение -------
  var THEME_KEY = 'rm_theme';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  try { applyTheme(localStorage.getItem(THEME_KEY) || 'dark'); } catch (e) { applyTheme('dark'); }

  // ------- Роль: organizer | participant -------
  var ROLE_KEY = 'rm_role';
  var role = 'organizer';
  try { role = localStorage.getItem(ROLE_KEY) || 'organizer'; } catch (e) {}
  function setRole(r) {
    role = r;
    // Дефолтные вкладки роли (организаторские gw/tr/ch/me, участника feed/mine/pinfo).
    var ptabs = ['feed', 'mine', 'pinfo'];
    if (r === 'participant' && ptabs.indexOf(state.tab) === -1) state.tab = 'feed';
    if (r === 'organizer' && ptabs.indexOf(state.tab) > -1) state.tab = 'gw';
    if (r === 'organizer') state.view = 'home';
    try { localStorage.setItem(ROLE_KEY, r); } catch (e) {}
    render();
  }

  var state = { tab: 'gw', sort: 'date', filter: 'all', dynDays: 14,
                gwSort: 'date', gwFilter: 'all',
                chID: null, chTitle: '', view: 'home' };

  // Единый регистратор BackButton (onClick добавляет, не заменяет!)
  var curBack = null;
  function onBack(fn) {
    if (!backBtn) return;
    if (curBack) { try { backBtn.offClick(curBack); } catch (e) {} }
    curBack = fn;
    try { backBtn.onClick(fn); } catch (e) {}
  }

  // ------- Черновики форм -------
  var DRAFT_GW_KEY = 'rm_gw_draft_v2';
  var DRAFT_TR_KEY = 'rm_tr_draft_v2';
  function saveDraft(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
  function loadDraft(key) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function clearDraft(key) { try { localStorage.removeItem(key); } catch (e) {} }
  function autosaveDraft(key, fieldIds) {
    fieldIds.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function () { persistDraft(key, fieldIds); });
    });
  }
  function persistDraft(key, fieldIds, extra) {
    var d = loadDraft(key) || {};
    fieldIds.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) d[id] = el.value;
    });
    if (extra) Object.keys(extra).forEach(function (k) { d[k] = extra[k]; });
    saveDraft(key, d);
  }
  function restoreDraft(key, fieldIds) {
    var d = loadDraft(key);
    if (!d) return false;
    var any = false;
    fieldIds.forEach(function (id) {
      if (d[id]) { var el = document.getElementById(id); if (el) { el.value = d[id]; any = true; } }
    });
    return any;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function GET(path) {
    return fetch(path + (path.indexOf('?') > -1 ? '&' : '?') + 'init_data=' + encodeURIComponent(initData))
      .then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  function POST(path, body) {
    return fetch(path + '?init_data=' + encodeURIComponent(initData), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }
  function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) + '%' : '—'; }
  function header(title, sub, canBack) {
    return '<header>' + (canBack ? '<button class="back" id="hb">←</button>' : '') +
      '<div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div></header>';
  }
  // Прогресс-бар кирпичиками: filled из total.
  function progress(filled, total) {
    var h = '<div class="progress">';
    for (var i = 0; i < total; i++) h += '<span class="' + (i < filled ? 'f' : '') + '"></span>';
    return h + '</div>';
  }
  // SVG-конус (стандартная воронка фильтра).
  var FUNNEL = '<svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"/></svg>';
  // Иконки темы: в тёмной показываем солнце (тап → светлая), и наоборот.
  var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12H5M19 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24"><path d="M20.2 14.3A8.3 8.3 0 0 1 9.7 3.8a8.3 8.3 0 1 0 10.5 10.5z"/></svg>';
  function themeBtn(id) {
    var dark = document.documentElement.getAttribute('data-theme') !== 'light';
    return '<button class="iconbtn" id="' + id + '" title="Светлая/тёмная тема">' + (dark ? SUN : MOON) + '</button>';
  }
  function bindThemeBtn(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.onclick = function () {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
      // Тема применяется CSS-переменными мгновенно — меняем только иконку.
      el.innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? MOON : SUN;
    };
  }
  // Слайд при смене экрана: направление задаётся ДО render(), снимается после.
  var slideDir = 0;
  function tabOrder() { return role === 'participant' ? ['feed', 'mine', 'pinfo'] : ['gw', 'tr', 'ch', 'me']; }
  function animateSlide() {
    if (!slideDir) return;
    var a = slideDir > 0 ? 'slideR' : 'slideL';
    slideDir = 0;
    app.style.animation = 'none';
    void app.offsetWidth; // reflow: перезапуск анимации с нуля
    app.style.animation = a + ' .22s ease';
  }
  function filterBtn(id) { return '<button class="iconbtn" id="' + id + '">' + FUNNEL + '</button>'; }
  function ddClose(dd) { dd.innerHTML = ''; }
  function ddBind(dd) {
    setTimeout(function () {
      document.addEventListener('click', function close() { ddClose(dd); document.removeEventListener('click', close); });
    }, 10);
  }

  // ================================================================
  //  РОЛЬ: УЧАСТНИК (dummy)
  // ================================================================
  function renderParticipant() {
    // Вход по startapp=participant: роль из localStorage, вкладка ещё организаторская.
    if (['feed', 'mine', 'pinfo'].indexOf(state.tab) === -1) state.tab = 'feed';
    fab.classList.add('hidden');
    tabbar.innerHTML =
      '<button class="tab ' + (state.tab === 'feed' ? 'on' : '') + '" data-tab="feed"><span class="ico">📻</span>Лента розыгрышей</button>' +
      '<button class="tab ' + (state.tab === 'mine' ? 'on' : '') + '" data-tab="mine"><span class="ico">🎟</span>Мои участия</button>' +
      '<button class="tab ' + (state.tab === 'pinfo' ? 'on' : '') + '" data-tab="pinfo"><span class="ico">ℹ️</span>Инфо</button>';
    bindTabs();
    var body;
    if (state.tab === 'feed') body = '<div class="empty">Здесь будет лента розыгрышей</div>';
    else if (state.tab === 'mine') body = '<div class="empty">Здесь будет список конкурсов, в которых вы участвуете</div>';
    else body = '<div class="card"><div class="title">RandoMaster</div><div class="meta">Тут будет какая-то инфо.</div></div>';
    app.innerHTML = roleswitch() + body;
    bindRoleSwitch();
  }

  function roleswitch() {
    return '<div class="roleswitch">' +
      '<button class="' + (role === 'participant' ? 'on' : '') + '" data-role="participant">Участникам</button>' +
      '<button class="' + (role === 'organizer' ? 'on' : '') + '" data-role="organizer">Организаторам</button></div>';
  }
  function bindRoleSwitch() {
    app.querySelectorAll('[data-role]').forEach(function (b) {
      b.onclick = function () { setRole(b.getAttribute('data-role')); };
    });
  }

  // ================================================================
  //  РОЛЬ: ОРГАНИЗАТОР — вкладки
  // ================================================================
  function renderOrganizer() {
    if (state.tab === 'me') renderMore();
    else if (state.tab === 'tr') renderTrackingTab();
    else if (state.tab === 'ch') renderChannelsTab();
    else renderGiveaways();
  }

  function bindTabs() {
    tabbar.querySelectorAll('.tab').forEach(function (t) {
      t.onclick = function () {
        var nt = t.getAttribute('data-tab');
        if (nt === state.tab) return;
        // Слайд по порядку табов: к следующему — вправо, к предыдущему — влево.
        var ord = tabOrder();
        slideDir = ord.indexOf(nt) > ord.indexOf(state.tab) ? 1 : -1;
        state.tab = nt;
        state.view = 'tab';
        render();
      };
    });
  }
  // Версия с плитками: нижних табов нет — «назад» ведёт на домашний экран.
  function organizerTabs() {
    tabbar.classList.add('hidden');
    tabbar.innerHTML = '';
    if (backBtn) backBtn.show();
    onBack(goHome);
  }

  // ---------- Список розыгрышей ----------
  function renderGiveaways() {
    state.tab = 'gw'; state.view = 'tab';
    organizerTabs();
    fab.classList.remove('hidden');
    fab.textContent = 'Создать розыгрыш';
    fab.onclick = function () { renderGwWizard(0); };
    var fn = { all:'Все', draft:'Черновики', scheduled:'Запланированные', active:'Идут', finished:'Завершённые', archive:'Архив' };
    app.innerHTML = roleswitch() +
      '<header style="position:relative"><button class="back" id="hh">←</button><div><h1>Розыгрыши</h1></div>' + filterBtn('gw-filter') + '</header>' +
      '<div id="gw-dd"></div><div id="list"><div class="skel"></div><div class="skel"></div></div>';
    bindRoleSwitch();
    document.getElementById('hh').onclick = goHome;
    document.getElementById('gw-filter').onclick = function (e) {
      e.stopPropagation();
      var dd = document.getElementById('gw-dd');
      if (dd.innerHTML) { ddClose(dd); return; }
      var items = '<div class="dsep">Показать</div>';
      ['all','draft','scheduled','active','finished','archive'].forEach(function (f) {
        items += '<div class="ditem ' + (state.gwFilter === f ? 'on' : '') + '" data-f="' + f + '">' + fn[f] + '</div>';
      });
      items += '<div class="dsep">Сортировка</div>';
      items += '<div class="ditem ' + (state.gwSort === 'date' ? 'on' : '') + '" data-s="date">Сначала новые</div>';
      items += '<div class="ditem ' + (state.gwSort === 'name' ? 'on' : '') + '" data-s="name">По имени (А→Я)</div>';
      dd.innerHTML = '<div class="dropdown">' + items + '</div>';
      dd.querySelectorAll('[data-f]').forEach(function (el) { el.onclick = function () { state.gwFilter = el.getAttribute('data-f'); renderGiveaways(); }; });
      dd.querySelectorAll('[data-s]').forEach(function (el) { el.onclick = function () { state.gwSort = el.getAttribute('data-s'); renderGiveaways(); }; });
      ddBind(dd);
    };
    GET('/app/api/analytics/giveaways').then(function (d) {
      var gws = d.giveaways || [];
      if (state.gwSort === 'name') gws.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });
      // Архив скрыт из всех фильтров, кроме «Архив» (там — только он).
      if (state.gwFilter === 'archive') {
        gws = gws.filter(function (g) { return g.archived; });
      } else {
        gws = gws.filter(function (g) { return !g.archived && (state.gwFilter === 'all' || g.status === state.gwFilter); });
      }
      var m = { draft:'Черновик', scheduled:'Запланирован', active:'Идёт', finished:'Завершён', cancelled:'Отменён' };
      document.getElementById('list').innerHTML = gws.map(function (g) {
        var when = g.status === 'draft' ? 'изменён ' + esc(g.when) : 'итоги ' + esc(g.when);
        var editBtn = g.status === 'draft'
          ? '<button class="btn sm sec" data-a="gwedit" data-id="' + g.id + '" style="margin-top:8px">✏️ Редактировать</button>'
          : '';
        var bc = g.status === 'active' ? 'ok' : (g.status === 'draft' ? 'warn' : '');
        return '<div class="card tap" data-a="gw" data-id="' + g.id + '">' +
          '<div class="row"><div class="title">' + esc(g.name) + '</div><span class="badge ' + bc + '">' + (g.archived ? 'архив' : (m[g.status] || g.status)) + '</span></div>' +
          '<div class="meta">' + when + ' · участников: ' + g.parts + ' · победителей: ' + g.winners + '</div>' + editBtn + '</div>';
      }).join('') || '<div class="empty">Пока пусто.<br>Создайте розыгрыш с домашнего экрана 🎁</div>';
      app.querySelectorAll('button[data-a="gwedit"]').forEach(function (b) {
        b.onclick = function (e) {
          e.stopPropagation(); // кнопка внутри карточки — карточку не открывать
          GET('/app/api/giveaways/edit/' + b.getAttribute('data-id')).then(function (d) {
            if (!d.ok) return;
            hydrateWizardFromServer(d.giveaway);
          });
        };
      });
      app.querySelectorAll('.card[data-a="gw"]').forEach(function (c) {
        c.onclick = function () {
          var g = gws.filter(function (x) { return String(x.id) === c.getAttribute('data-id'); })[0];
          if (g) renderGiveaway(g);
        };
      });
    }).catch(function () { document.getElementById('list').innerHTML = '<div class="empty">Не удалось загрузить.</div>'; });
  }

  function renderGiveaway(g) {
    state.view = 'detail';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();
    app.innerHTML = roleswitch() + header(g.name, 'розыгрыш', true) +
      '<div class="card"><div class="stats">' +
      '<div class="stat"><div class="num">' + g.parts + '</div><div class="lbl">участников</div></div>' +
      '<div class="stat"><div class="num">' + g.winners + '</div><div class="lbl">победителей</div></div>' +
      '<div class="stat"><div class="num" style="font-size:11px;padding-top:8px">' + esc(g.when) + '</div><div class="lbl">' + esc(g.status) + (g.archived ? ' · архив' : '') + '</div></div>' +
      '</div></div>' +
      '<div id="g-scope"></div>' +
      '<div class="card tap" data-a="sendpost"><div class="row"><div class="title">Отправить пост мне в чат</div><span>→</span></div>' +
      '<div class="meta">готовый пост точным видом (текст, медиа, кнопка)</div></div>' +
      '<div class="msg" id="sendmsg"></div>' +
      '<div class="card tap" data-a="archgw"><div class="row"><div class="title">' +
        (g.archived ? '↩️ Вернуть из архива' : '📦 В архив') + '</div><span>→</span></div>' +
      '<div class="meta">' + (g.archived
        ? 'розыгрыш снова появится в списке'
        : 'скрыть из списка — данные и статистика сохранятся') + '</div></div>' +
      '<div class="card tap" data-a="delgw"><div class="row"><div class="title" style="color:#c66">🗑 Удалить навсегда</div><span>→</span></div>' +
      '<div class="meta">розыгрыш удалится вместе с участниками и результатами — отменить нельзя</div></div>' +
      '<div class="msg" id="delgwmsg"></div>';
    bindRoleSwitch();
    onBack(renderGiveaways);
    document.getElementById('hb').onclick = renderGiveaways;
    // Скоп трекинг-ссылок розыгрыша (авто + привязанные): клики/подписки.
    GET('/app/api/analytics/giveaway-links/' + g.id).then(function (d) {
      if (!d.ok) return;
      var links = d.links || [], t = d.totals || {};
      var el = document.getElementById('g-scope');
      if (!el) return;
      el.innerHTML = '<div class="sect">Статистика</div>' +
        (links.length ? '<div class="card"><div class="stats">' +
          '<div class="stat"><div class="num">' + (t.clicks || 0) + '</div><div class="lbl">клики (сумма)</div></div>' +
          '<div class="stat"><div class="num">' + (t.signups || 0) + '</div><div class="lbl">подписки (сумма)</div></div>' +
          '<div class="stat"><div class="num">' + (t.links || 0) + '</div><div class="lbl">ссылок</div></div></div></div>' +
          links.map(function (l) {
            return '<div class="card"><div class="row"><div class="title" style="font-size:13.5px">' + esc(l.name) + '</div>' +
              '<span class="badge">' + (l.clicks || 0) + ' км · ' + (l.signups || 0) + ' пп</span></div></div>';
          }).join('') : '');
    });
    var archBtn = app.querySelector('[data-a="archgw"]');
    if (archBtn) archBtn.onclick = function () {
      POST('/app/api/giveaways/archive', { giveaway_id: parseInt(g.id, 10), archived: !g.archived })
        .then(function (d) {
          if (d.ok) {
            g.archived = !g.archived;
            renderGiveaway(g);
          }
        });
    };
    var delGw = app.querySelector('[data-a="delgw"]');
    if (delGw) delGw.onclick = function () {
      // confirm() в вебвью MAX недоступен — двухтаповое подтверждение.
      if (!delGw.classList.contains('armed')) {
        delGw.classList.add('armed');
        var tt = delGw.querySelector('.title');
        if (tt) tt.textContent = '🗑 Удалить окончательно?';
        return;
      }
      POST('/app/api/giveaways/delete', { giveaway_id: parseInt(g.id, 10) }).then(function (d) {
        if (d.ok) { renderGiveaways(); return; }
        var m = document.getElementById('delgwmsg');
        if (m) { m.textContent = '⚠️ ' + (d.error || 'ошибка'); m.className = 'msg err'; }
      });
    };
    app.querySelector('[data-a="sendpost"]').onclick = function () {
      POST('/app/api/analytics/send-post', { giveaway_id: parseInt(g.id, 10) }).then(function (d) {
        var el = document.getElementById('sendmsg');
        el.textContent = d.ok ? '✅ Пост отправлен — проверьте чат с ботом' : '⚠️ ' + (d.error || 'ошибка');
        el.className = 'msg ' + (d.ok ? 'ok' : 'err');
      });
    };
  }

  // ================================================================
  //  ПОШАГОВЫЙ ВИЗАРД РОЗЫГРЫША (7 шагов): Название → Каналы → Ссылки →
  //  Пост → Итоги → Старт → Дополнительно (▰▰▱▱ + Назад/Далее). Название —
  //  первым (черновик сразу узнаваем в списке). Ссылки — отдельный ЯВНЫЙ шаг:
  //  под каждый канал генерится уникальная ссылка (видно/скопировать);
  //  вшивание — на шаге «Пост». Финал — пост в чат на утверждение (Да/Нет).
  // ================================================================
  var GW_STEPS = ['Название', 'Каналы', 'Ссылки', 'Пост', 'Итоги', 'Старт', 'Дополнительно'];

  // ---------- Модальный пикер каналов (с поиском; каналов может быть сотни) ----------
  function openChannelPicker(opts) {
    var dd0 = document.createElement('div');
    dd0.className = 'sheetwrap';
    dd0.innerHTML = '<div class="sheet">' +
      '<div class="sh"><div class="t">' + esc(opts.title) + '</div><button class="x" id="cp-x">✕</button></div>' +
      '<input class="inp" id="cp-q" placeholder="Поиск канала…">' +
      '<div class="list" id="cp-list"><div class="skel"></div></div>' +
      '<button class="btn" id="cp-ok">' + (opts.okLabel || 'Готово') + '</button></div>';
    document.body.appendChild(dd0);
    var sel = (opts.selected || []).slice();
    var chs = [];
    function close() { dd0.remove(); }
    function render() {
      var q = (document.getElementById('cp-q').value || '').toLowerCase();
      var list = chs.filter(function (c) { return !q || c.title.toLowerCase().indexOf(q) > -1; });
      document.getElementById('cp-list').innerHTML = list.map(function (c) {
        var on = sel.indexOf(c.id) > -1;
        return '<div class="srow ' + (on ? 'on' : '') + '" data-id="' + c.id + '" data-lock="' + (c.lock ? 1 : 0) + '">' +
          '<div><div class="l">' + (on ? '✓ ' : '') + esc(c.title) + '</div>' +
          '<div class="m">' + (c.admin ? 'бот админ' : 'нет прав бота') + '</div></div></div>';
      }).join('') || '<div class="empty">Ничего не найдено</div>';
      document.querySelectorAll('#cp-list .srow').forEach(function (r) {
        r.onclick = function () {
          var id = parseInt(r.getAttribute('data-id'), 10);
          if (r.getAttribute('data-lock') === '1') return; // канал публикации — всегда в подписках
          var i = sel.indexOf(id);
          if (i > -1) sel.splice(i, 1); else sel.push(id);
          render();
        };
      });
    }
    GET('/app/api/analytics/channels').then(function (d) {
      chs = (d.channels || []).filter(function (c) { return opts.adminOnly ? c.admin : true; });
      chs.forEach(function (c) { c.lock = (opts.locked || []).indexOf(c.id) > -1; });
      render();
    }).catch(function () { document.getElementById('cp-list').innerHTML = '<div class="empty">Ошибка загрузки</div>'; });
    document.getElementById('cp-x').onclick = close;
    dd0.onclick = function (e) { if (e.target === dd0) close(); };
    document.getElementById('cp-q').oninput = render;
    document.getElementById('cp-ok').onclick = function () { close(); opts.onDone(sel); };
  }

  // ---------- Пикер «Вшить трекинг-ссылку» ----------
  function openLinkPicker(links, onInsert, onOpenTracking) {
    var dd0 = document.createElement('div');
    dd0.className = 'sheetwrap';
    var rows = links.map(function (l, i) {
      return '<div class="srow" data-i="' + i + '"><div><div class="l">🔗 ' + esc(l.name) + '</div>' +
        '<div class="m">' + esc(l.url) + '</div></div><div>Вшить →</div></div>';
    }).join('');
    dd0.innerHTML = '<div class="sheet">' +
      '<div class="sh"><div class="t">Вшить трекинг-ссылку</div><button class="x" id="lp-x">✕</button></div>' +
      '<div class="list">' + (rows || '<div class="empty">Ссылок пока нет</div>') + '</div>' +
      '<div class="meta" style="margin:6px 0 2px">Нужна другая ссылка? Создайте её в Трекинге и вернитесь — черновик сохранён.</div>' +
      '<button class="btn sec" id="lp-track">Открыть Трекинг →</button></div>';
    document.body.appendChild(dd0);
    function close() { dd0.remove(); }
    document.getElementById('lp-x').onclick = close;
    dd0.onclick = function (e) { if (e.target === dd0) close(); };
    dd0.querySelectorAll('.srow').forEach(function (r) {
      r.onclick = function () { close(); onInsert(links[parseInt(r.getAttribute('data-i'), 10)]); };
    });
    document.getElementById('lp-track').onclick = function () { close(); onOpenTracking(); };
  }

  // Загрузить ссылки для вшивания: сгенерированные под розыгрыш + все ссылки
  // выбранных каналов (созданные вручную в Трекинге).
  function loadEmbeddableLinks(done) {
    var dd = loadDraft(DRAFT_GW_KEY) || {};
    var out = [];
    (dd.links || []).forEach(function (l) { out.push(l); });
    var chs = dd.pub_channels || [];
    var left = chs.length;
    if (!left) return done(out);
    chs.forEach(function (chID) {
      GET('/app/api/analytics/channel/' + chID).then(function (d) {
        (d.links || []).forEach(function (l) {
          if (l.url) out.push({ url: l.url, name: l.name, channel_id: chID });
        });
      }).catch(function () {}).then(function () { if (--left === 0) done(out); });
    });
  }

  function renderGwWizard(step) {
    state.view = 'create';
    fab.classList.add('hidden');
    if (backBtn) backBtn.show();

    // Навигация: gotoStep сохраняет ЦЕЛЕВОЙ шаг до рендера — возврат «Назад»
    // на шаг 0 не затягивает обратно на сохранённый шаг черновика.
    function gotoStep(n) {
      persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: n });
      renderGwWizard(n);
    }
    onBack(function () { step > 0 ? gotoStep(step - 1) : renderHome(); });

    var GW_FIELDS = ['f-post','f-name','f-btn','f-winners','f-finat','f-fincnt','f-pubat','f-winmsg'];
    var html = roleswitch() + header('Создание розыгрыша', 'шаг ' + (step + 1) + ' из 7', true) +
      progress(step, 7) + '<div class="steptitle">' + GW_STEPS[step] + '</div><div id="wz">';

    if (step === 0) html +=
      '<label class="lbl" style="margin-top:0">Название розыгрыша *</label>' +
      '<input class="inp" id="f-name" placeholder="Например: iPhone в декабре">' +
      '<div class="meta">По названию черновик легко найти в «Мои розыгрыши».</div>';
    else if (step === 1) html +=
      '<div class="meta" style="margin-top:0">Под выбранные каналы сразу сгенерируем уникальные трекинг-ссылки — следующий шаг покажет их списком.</div>' +
      '<label class="lbl">Каналы публикации *</label>' +
      '<div class="card tap" data-a="pick-pub" style="margin-top:4px"><div class="row"><div class="title" id="f-pubsum">Выбрать каналы…</div><span>→</span></div></div>' +
      '<label class="lbl">Каналы обязательной подписки — только выбранные вами</label>' +
      '<div class="card tap" data-a="pick-sub" style="margin-top:4px"><div class="row"><div class="title" id="f-subsum">Все каналы публикации (по умолчанию)</div><span>→</span></div></div>' +
      '<div class="meta">Подписка нужна не на все каналы публикации — уберите лишние в выборе. Пусто = без проверки подписки.</div>' +
      '<div class="meta" id="f-linksinfo"></div>';
    else if (step === 2) html +=
      '<div class="meta" style="margin-top:0">Ссылки считают переходы с каждого канала, где выйдет пост. Отметьте каналы и сгенерируйте ссылки — они привяжутся к розыгрышу.</div>' +
      '<div id="f-chsel" class="pick"></div>' +
      '<button class="btn" id="f-genlinks">🔗 Сгенерировать ссылки для отмеченных</button>' +
      '<div id="f-scope"></div>' +
      '<div class="card"><div class="meta">Нужны <b>суперссылки</b> (на конкретный пост)? Создайте их в Трекинге и привяжите к этому розыгрышу — они встанут в общий скоп и статистику.</div>' +
      '<button class="btn sec sm" id="f-gotrack" style="margin-top:8px">Открыть Трекинг →</button></div>';
    else if (step === 3) html +=
      '<label class="lbl" style="margin-top:0">Текст поста *</label>' +
      '<textarea id="f-post" placeholder="🎁 РОЗЫГРЫШ!&#10;&#10;Условия простые: подпишись и нажми «Участвовать»…"></textarea>' +
      '<div class="fmtbar">' +
        '<button data-fmt="b" title="Жирный"><b>Ж</b></button>' +
        '<button data-fmt="i" title="Курсив"><i>К</i></button>' +
        '<button data-fmt="s" title="Зачёркнутый"><s>З</s></button>' +
        '<button data-fmt="a" title="Ссылка">🔗</button>' +
        '<button id="f-embed" title="Вшить трекинг-ссылку" style="width:auto;padding:0 12px">Вшить ссылку</button>' +
      '</div>' +
      '<div class="fmtbar hidden" id="f-linkbar" style="margin-top:6px">' +
        '<input class="inp" id="f-linkurl" placeholder="https://…" style="margin-top:0;flex:1">' +
        '<button class="btn sm" id="f-linkok" style="margin-top:0">Вставить</button>' +
      '</div>' +
      '<div class="meta">Ж — **жирный**, К — _курсив_, З — ~~зачёркнутый~~, 🔗 — [текст](ссылка). Выделения и ссылки работают в посте.</div>' +
      '<label class="lbl">Фото / видео (до 50 МБ)</label>' +
      '<div class="thumbs" id="f-media"></div>' +
      '<label class="btn sec sm" id="f-addmedia" for="f-file" style="margin-top:8px;display:inline-block">＋ Добавить медиа</label>' +
      '<input type="file" id="f-file" accept="image/*,video/*" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">';
    else if (step === 4) html +=
      '<label class="lbl" style="margin-top:0">Итоги подвести</label>' +
      '<div class="seg" id="f-finmode"><div class="chip on" data-v="time">⏰ По времени</div><div class="chip" data-v="count">👥 По числу</div></div>' +
      '<div id="f-fintime"><label class="lbl">Дата итогов (МСК) — ДД.ММ.ГГГГ ЧЧ:ММ</label>' +
      '<input class="inp" id="f-finat" inputmode="numeric" placeholder="' + defaultFinish() + '">' +
      '<div class="seg" style="margin-top:6px">' +
        '<div class="chip" data-dd="1" data-h="21">Завтра 21:00</div>' +
        '<div class="chip" data-dd="3" data-h="21">+3 дня</div>' +
        '<div class="chip" data-dd="7" data-h="21">+7 дней</div></div>' +
      '<div class="meta" id="f-finval" style="margin-top:4px"></div></div>' +
      '<div id="f-fincount" class="hidden"><label class="lbl">Целевое число участников (от 10)</label>' +
      '<input class="inp" id="f-fincnt" type="number" placeholder="100" min="10"></div>' +
      '<label class="lbl">Победителей (1–100)</label>' +
      '<input class="inp" id="f-winners" type="number" value="1" min="1" max="100">';
    else if (step === 5) html +=
      '<label class="lbl" style="margin-top:0">Старт публикации</label>' +
      '<div class="seg" id="f-pubmode"><div class="chip on" data-v="now">🚀 Сразу</div><div class="chip" data-v="at">🕐 По времени</div></div>' +
      '<div id="f-pubat-w" class="hidden"><label class="lbl">Дата публикации (МСК) — ДД.ММ.ГГГГ ЧЧ:ММ</label>' +
      '<input class="inp" id="f-pubat" inputmode="numeric" placeholder="ДД.ММ.ГГГГ ЧЧ:ММ">' +
      '<div class="seg" style="margin-top:6px">' +
        '<div class="chip" data-dd="0" data-h="now">Через час</div>' +
        '<div class="chip" data-dd="1" data-h="12">Завтра 12:00</div></div>' +
      '<div class="meta" id="f-pubval" style="margin-top:4px"></div></div>';
    else html +=
      '<label class="lbl" style="margin-top:0">Дополнительно</label>' +
      '<div class="seg"><div class="chip on" id="f-captcha">🛡 Капча</div><div class="chip" id="f-referral">👥 Друзья</div><div class="chip on" id="f-resinpost">📍 Итоги в посте</div></div>' +
      '<label class="lbl">Текст кнопки участия</label>' +
      '<input class="inp" id="f-btn" placeholder="Участвовать" value="Участвовать">' +
      '<label class="lbl">Сообщение победителям (необязательно)</label>' +
      '<textarea id="f-winmsg" style="min-height:60px" placeholder="Поздравляем! Напишите @manager…"></textarea>' +
      '<div class="card"><div class="meta">После отправки пост придёт вам в чат MAX с кнопками <b>Да / Нет</b>: «Да» — публикуем (сразу или по расписанию), «Нет» — вернём сюда на правку.</div></div>';

    html += '<div class="msg" id="f-msg"></div><div id="wz-after"></div></div>' +
      '<div class="wznav">' +
      (step > 0 ? '<button class="btn sec" id="wz-prev">← Назад</button>' : '') +
      (step < 6 ? '<button class="btn" id="wz-next">Далее →</button>' : '') +
      (step === 6 ? '<button class="btn sec" id="wz-draft">💾 Черновик</button><button class="btn" id="wz-go">📤 На утверждение</button>' : '') +
      '</div>';
    app.innerHTML = html;
    bindRoleSwitch();
    document.getElementById('hb').onclick = function () { step > 0 ? gotoStep(step - 1) : renderHome(); };
    if (step > 0) document.getElementById('wz-prev').onclick = function () { gotoStep(step - 1); };
    if (step < 6) document.getElementById('wz-next').onclick = function () {
      if (step === 0) {
        var nm0 = val('f-name') || (loadDraft(DRAFT_GW_KEY) || {})['f-name'] || '';
        if (!nm0) return showMsg('f-msg', 'Введите название — по нему найдёте черновик', true);
        // Черновик создаётся/проверяется сразу С названием — узнаваем в
        // «Мои розыгрыши», ссылки генерируются уже с именем.
        function createDraft() {
          showMsg('f-msg', '⏳ Сохраняю…');
          POST('/app/api/giveaways/draft', { name: nm0 }).then(function (d) {
            if (!d.ok) throw 0;
            var dd2 = loadDraft(DRAFT_GW_KEY) || {};
            dd2.giveaway_id = d.giveaway_id;
            saveDraft(DRAFT_GW_KEY, dd2);
            showMsg('f-msg', '');
            persistDraft(DRAFT_GW_KEY, GW_FIELDS, { giveaway_id: d.giveaway_id, step: 1 });
            renderGwWizard(1);
          }).catch(function () {
            showMsg('f-msg', '⚠️ Не удалось сохранить черновик — проверьте соединение', true);
          });
        }
        var dcur0 = loadDraft(DRAFT_GW_KEY) || {};
        if (dcur0.giveaway_id) {
          // Проверяем, что черновик ещё ЖИВ: могли уйти с прошлого прохождения
          // (утвердили в чате / удалили) — id в localStorage устарел, и
          // генерация ссылок падала «уже опубликован».
          showMsg('f-msg', '⏳ Проверяю черновик…');
          GET('/app/api/giveaways/edit/' + dcur0.giveaway_id).then(function (d) {
            if (d.ok) {
              // Жив: обновляем имя сразу (вместе со ссылками).
              POST('/app/api/giveaways/rename', { giveaway_id: dcur0.giveaway_id, name: nm0 })
                .then(function () { gotoStep(1); })
                .catch(function () { gotoStep(1); });
              return;
            }
            // Устарел: сбросить привязку и создать новый черновик.
            var dd3 = loadDraft(DRAFT_GW_KEY) || {};
            delete dd3.giveaway_id;
            delete dd3.links;
            delete dd3.pub_channels;
            delete dd3.sub_channels;
            delete dd3.sub_set;
            delete dd3.gen_channels;
            delete dd3.media_tokens;
            saveDraft(DRAFT_GW_KEY, dd3);
            createDraft();
          }).catch(function () { createDraft(); });
          return;
        }
        createDraft();
        return;
      }
      if (step === 1) {
        var d0 = loadDraft(DRAFT_GW_KEY) || {};
        if (!(pubSel.length ? pubSel : (d0.pub_channels || [])).length) return showMsg('f-msg', 'Выберите хотя бы один канал публикации', true);
        persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: 2 });
        renderGwWizard(2); return;
      }
      if (step === 3 && !val('f-post') && !media.length) return showMsg('f-msg', 'Добавьте текст поста или медиа', true);
      gotoStep(step + 1);
    };

    // Черновик: первый вход — вернуться на сохранённый шаг; поля — из черновика.
    // Резюм рендерит НАПРЯМУЮ (без persistDraft): gotoStep сохраняет значения
    // текущего DOM шага 0 — он только что отрендерен пустым и затёр бы черновик.
    var dd = loadDraft(DRAFT_GW_KEY) || {};
    if (step === 0 && dd.step > 0) {
      renderGwWizard(dd.step); return;
    }
    restoreDraft(DRAFT_GW_KEY, GW_FIELDS);
    autosaveDraft(DRAFT_GW_KEY, GW_FIELDS);
    persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: step });

    var media = dd.media_tokens || [];
    var pubSel = dd.pub_channels || [];
    var subSel = dd.sub_channels || [];

    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

    // ---------- Шаг «Каналы»: пикеры + сводка ----------
    function pubNames() {
      return GET('/app/api/analytics/channels').then(function (d) {
        var by = {};
        (d.channels || []).forEach(function (c) { by[c.id] = c.title; });
        return by;
      });
    }
    function refreshStepCh() {
      pubNames().then(function (by) {
        var p = document.getElementById('f-pubsum'), s = document.getElementById('f-subsum');
        if (p) p.textContent = pubSel.length ? pubSel.map(function (id) { return by[id] || ('#' + id); }).join(', ') : 'Выбрать каналы…';
        if (s) {
          if (dd.sub_set) {
            s.textContent = subSel.length
              ? '✓ ' + subSel.length + ' из ' + pubSel.length + ': ' + subSel.map(function (id) { return by[id] || ('#' + id); }).join(', ')
              : 'Без проверки подписки (пусто)';
          } else {
            s.textContent = 'Все каналы публикации (по умолчанию)';
          }
        }
        var li = document.getElementById('f-linksinfo');
        if (li) li.textContent = (dd.links || []).length ? '🔗 Ссылок под розыгрыш: ' + dd.links.length + ' — список на следующем шаге' : '';
      });
    }
    var ppBtn = app.querySelector('[data-a="pick-pub"]');
    if (ppBtn) ppBtn.onclick = function () {
      openChannelPicker({
        title: 'Каналы публикации', adminOnly: true, selected: pubSel,
        onDone: function (sel) {
          pubSel = sel;
          persistDraft(DRAFT_GW_KEY, GW_FIELDS, { pub_channels: pubSel, sub_channels: subSel, step: step });
          refreshStepCh();
        }
      });
    };
    var psBtn = app.querySelector('[data-a="pick-sub"]');
    if (psBtn) psBtn.onclick = function () {
      openChannelPicker({
        title: 'Каналы подписки', selected: subSel,
        onDone: function (sel) {
          subSel = sel; // свободный выбор: любое подмножество, можно пустое
          dd.sub_set = true; dd.sub_channels = sel; // сводка читает dd — не только localStorage
          persistDraft(DRAFT_GW_KEY, GW_FIELDS, { pub_channels: pubSel, sub_channels: subSel, sub_set: true, step: step });
          refreshStepCh();
        }
      });
    };
    refreshStepCh();

    // ---------- Шаг «Ссылки»: выбор каналов → генерация → скоп со статами ----------
    var genSelKeep = (dd.gen_channels || null);
    var chSel = document.getElementById('f-chsel');
    if (chSel) {
      pubNames().then(function (by) {
        var genSel = genSelKeep || pubSel.slice(); // по умолчанию все каналы публикации
        chSel.innerHTML = pubSel.map(function (id) {
          return '<div class="chip ' + (genSel.indexOf(id) > -1 ? 'on' : '') + '" data-gid="' + id + '">' +
            (genSel.indexOf(id) > -1 ? '✓ ' : '') + esc(by[id] || ('#' + id)) + '</div>';
        }).join('');
        chSel.querySelectorAll('[data-gid]').forEach(function (c) {
          c.onclick = function () {
            var id = parseInt(c.getAttribute('data-gid'), 10);
            var i = genSel.indexOf(id);
            if (i > -1) genSel.splice(i, 1); else genSel.push(id);
            genSelKeep = genSel;
            persistDraft(DRAFT_GW_KEY, GW_FIELDS, { gen_channels: genSel, step: step });
            c.classList.toggle('on');
            c.textContent = (genSel.indexOf(id) > -1 ? '✓ ' : '') + (by[id] || ('#' + id));
          };
        });
        var gb = document.getElementById('f-genlinks');
        if (gb) gb.onclick = function () {
          if (!genSel.length) return showMsg('f-msg', 'Отметьте хотя бы один канал', true);
          if (!dd.giveaway_id) return showMsg('f-msg', 'Сначала пройдите шаг «Каналы»', true);
          showMsg('f-msg', '⏳ Генерирую…');
          POST('/app/api/tracking/for-giveaway', {
            giveaway_id: dd.giveaway_id, channel_ids: genSel,
            name: dd['f-name'] || ''
          }).then(function (d) {
            if (!d.ok) return showMsg('f-msg', '⚠️ ' + (d.error || 'Ошибка'), true);
            dd.links = d.links || [];
            persistDraft(DRAFT_GW_KEY, GW_FIELDS, { links: dd.links, step: step });
            showMsg('f-msg', '✅ Готово — ссылки в скопе розыгрыша');
            renderScope(dd.links);
          });
        };
      });
    }
    function renderScope(links) {
      var scope = document.getElementById('f-scope');
      if (!scope) return;
      var totC = 0, totS = 0;
      links.forEach(function (l) { totC += l.clicks || 0; totS += l.signups || 0; });
      scope.innerHTML = '<div class="sect">Ссылки розыгрыша · ' + links.length + '</div>' +
        (links.length ? '<div class="card"><div class="stats">' +
          '<div class="stat"><div class="num">' + totC + '</div><div class="lbl">клики (сумма)</div></div>' +
          '<div class="stat"><div class="num">' + totS + '</div><div class="lbl">подписки (сумма)</div></div>' +
          '<div class="stat"><div class="num">' + links.length + '</div><div class="lbl">ссылок</div></div></div></div>' : '') +
        links.map(function (l, i) {
          return '<div class="card"><div class="row"><div class="title" style="font-size:13.5px">' + esc(l.name) + '</div>' +
            '<span class="badge">' + (l.clicks || 0) + ' км · ' + (l.signups || 0) + ' пп</span></div>' +
            '<div class="linkline" style="margin:4px 0;font-size:12px">' + esc(l.url) + '</div>' +
            '<button class="btn sm sec" data-copy="' + i + '">📋 Скопировать</button></div>';
        }).join('');
      scope.querySelectorAll('[data-copy]').forEach(function (b) {
        b.onclick = function () {
          var url = links[parseInt(b.getAttribute('data-copy'), 10)].url;
          if (navigator.clipboard) navigator.clipboard.writeText(url);
          b.textContent = '✅ Скопировано';
          setTimeout(function () { b.textContent = '📋 Скопировать'; }, 1500);
        };
      });
    }
    var scopeEl = document.getElementById('f-scope');
    if (scopeEl) {
      // Свежие статы с сервера (включая привязанные вручную ссылки).
      if (dd.giveaway_id) {
        GET('/app/api/analytics/giveaway-links/' + dd.giveaway_id).then(function (d) {
          if (!d.ok) return;
          dd.links = d.links || [];
          renderScope(dd.links);
        });
      } else {
        renderScope([]);
      }
    }
    var goTrack = document.getElementById('f-gotrack');
    if (goTrack) goTrack.onclick = function () {
      // Черновик сохранён — из Трекинга вернётесь через «Создать розыгрыш».
      state.tab = 'tr'; state.view = 'tab'; render();
    };

    // ---------- Шаг «Пост»: форматирование + вшивание ссылок + медиа ----------
    app.querySelectorAll('[data-fmt]').forEach(function (b) {
      b.onclick = function () { wrapSel('f-post', b.getAttribute('data-fmt')); };
    });
    var emb = document.getElementById('f-embed');
    if (emb) emb.onclick = function () {
      loadEmbeddableLinks(function (links) {
        openLinkPicker(links, function (l) {
          var el = document.getElementById('f-post');
          var s = el.selectionStart, e = el.selectionEnd, v = el.value;
          var label = v.slice(s, e) || l.name;
          el.value = v.slice(0, s) + '[' + label + '](' + l.url + ')' + v.slice(e);
          el.dispatchEvent(new Event('input'));
        }, function () {
          // seamless-переход в Трекинг: черновик сохранён, вернётесь через
          // «Создать розыгрыш» — визард продолжится с того же шага.
          state.tab = 'tr'; state.view = 'tab'; render();
        });
      });
    };
    var lok = document.getElementById('f-linkok');
    if (lok) lok.onclick = function () {
      var el = document.getElementById('f-post');
      var url = (document.getElementById('f-linkurl').value || '').trim();
      if (!url) return;
      var s = el.selectionStart, e = el.selectionEnd, v = el.value, sel = v.slice(s, e) || 'ссылка';
      el.value = v.slice(0, s) + '[' + sel + '](' + url + ')' + v.slice(e);
      document.getElementById('f-linkbar').classList.add('hidden');
      el.dispatchEvent(new Event('input'));
    };

    var fileInput = document.getElementById('f-file');
    if (fileInput) {
      if (media.length) renderMediaNow();
      // Пикер открывает сам <label for=f-file>: программный .click() по
      // скрытому input в вебвью MAX не срабатывал. Инпут вне экрана, но в DOM.
      fileInput.onchange = function () {
        var f = fileInput.files[0]; if (!f) return;
        var kind = f.type.indexOf('video') === 0 ? 'video' : 'image';
        var fd = new FormData(); fd.append('file', f); fd.append('kind', kind);
        document.getElementById('f-addmedia').textContent = '⏳ Загрузка…';
        fetch('/app/api/upload?init_data=' + encodeURIComponent(initData), { method: 'POST', body: fd })
          .then(function (r) { return r.json(); }).then(function (d) {
            document.getElementById('f-addmedia').textContent = '＋ Добавить медиа';
            if (d.ok) { media.push({ token: d.token, type: d.type }); renderMediaNow(); }
            else showMsg('f-msg', d.error || 'Ошибка загрузки', true);
            fileInput.value = '';
          });
      };
    }
    function renderMediaNow() {
      persistDraft(DRAFT_GW_KEY, GW_FIELDS, { media_tokens: media, step: step });
      var el = document.getElementById('f-media'); if (!el) return;
      el.innerHTML = media.map(function (m, i) {
        return '<div class="thumb">' + (m.type === 'video' ? '🎬' : '🖼') + '<button class="x" data-i="' + i + '">✕</button></div>';
      }).join('');
      el.querySelectorAll('.x').forEach(function (b) {
        b.onclick = function () { media.splice(parseInt(b.getAttribute('data-i'), 10), 1); renderMediaNow(); };
      });
    }

    // ---------- Итоги/Старт/Дополнительно: сегменты, тогглы, даты ----------
    segBind('f-finmode', function (v) {
      document.getElementById('f-fintime').classList.toggle('hidden', v !== 'time');
      document.getElementById('f-fincount').classList.toggle('hidden', v !== 'count');
    });
    segBind('f-pubmode', function (v) {
      document.getElementById('f-pubat-w').classList.toggle('hidden', v !== 'at');
    });
    toggleBind('f-captcha'); toggleBind('f-referral'); toggleBind('f-resinpost');
    if (dd.captcha === false) chipOff('f-captcha');
    if (dd.referral) chipOn2('f-referral');
    if (dd.results_in_post === false) chipOff('f-resinpost');
    if (dd.finish_mode === 'count') segSet('f-finmode', 'count');
    if (dd.publish_mode === 'at') segSet('f-pubmode', 'at');
    ['f-captcha','f-referral','f-resinpost'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', function () {
        setTimeout(function () {
          persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: step,
            captcha: chipOnEl('f-captcha'), referral: chipOnEl('f-referral'), results_in_post: chipOnEl('f-resinpost') });
        }, 10);
      });
    });
    if (document.getElementById('f-finmode')) document.getElementById('f-finmode').addEventListener('click', function () {
      setTimeout(function () { persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: step, finish_mode: segVal('f-finmode') }); }, 10);
    });
    if (document.getElementById('f-pubmode')) document.getElementById('f-pubmode').addEventListener('click', function () {
      setTimeout(function () { persistDraft(DRAFT_GW_KEY, GW_FIELDS, { step: step, publish_mode: segVal('f-pubmode') }); }, 10);
    });
    if (document.getElementById('f-finat')) bindDateField('f-finat', 'f-finval');
    if (document.getElementById('f-pubat')) bindDateField('f-pubat', 'f-pubval');

    // ---------- Финал: сохранение черновика / отправка на утверждение ----------
    var go = document.getElementById('wz-go'), dr = document.getElementById('wz-draft');
    function collect(saveDraftFlag, approvalFlag) {
      var fin = segVal('f-finmode') || dd.finish_mode || 'time';
      var pub = segVal('f-pubmode') || dd.publish_mode || 'now';
      return {
        giveaway_id: dd.giveaway_id || 0,
        approval: !!approvalFlag,
        post_text: val('f-post') || dd['f-post'] || '',
        post_format: 'markdown',
        media_tokens: media,
        pub_channels: pubSel.length ? pubSel : (dd.pub_channels || []),
        sub_channels: subSel.length ? subSel : (dd.sub_channels || []),
        sub_channels_set: dd.sub_set === true,
        name: val('f-name') || dd['f-name'] || '',
        button_text: val('f-btn') || 'Участвовать',
        winners: parseInt(val('f-winners') || dd['f-winners'] || '1', 10) || 1,
        finish_mode: fin,
        finish_at: val('f-finat') || dd['f-finat'] || '',
        finish_count: parseInt(val('f-fincnt') || '0', 10) || 0,
        publish_now: pub === 'now',
        publish_at: pub === 'at' ? (val('f-pubat') || dd['f-pubat'] || '') : '',
        captcha: chipOnEl('f-captcha') !== null ? chipOnEl('f-captcha') : (dd.captcha !== false),
        referral: chipOnEl('f-referral') !== null ? chipOnEl('f-referral') : !!dd.referral,
        results_in_post: chipOnEl('f-resinpost') !== null ? chipOnEl('f-resinpost') : (dd.results_in_post !== false),
        winners_message: val('f-winmsg') || '',
        save_draft: !!saveDraftFlag
      };
    }
    function submit(saveDraftFlag) {
      var body = collect(saveDraftFlag, !saveDraftFlag);
      if (!body.name) return showMsg('f-msg', 'Шаг 1: введите название', true);
      if (!body.pub_channels.length) return showMsg('f-msg', 'Шаг 2: выберите каналы публикации', true);
      if (!body.post_text && !body.media_tokens.length) return showMsg('f-msg', 'Шаг 4: добавьте текст поста или медиа', true);
      if (!saveDraftFlag) {
        // Даты: клиентская проверка формата до запроса (сервер валидирует так же).
        if (body.finish_mode === 'time' && body.finish_at && !dateOK(body.finish_at))
          return showMsg('f-msg', 'Дата итогов: формат ДД.ММ.ГГГГ ЧЧ:ММ', true);
        if (body.finish_mode === 'count' && body.finish_count < 10)
          return showMsg('f-msg', 'Целевое число участников — от 10', true);
        if (!body.publish_now && !body.publish_at)
          return showMsg('f-msg', 'Укажите дату публикации или выберите «🚀 Сразу»', true);
        if (!body.publish_now && body.publish_at && !dateOK(body.publish_at))
          return showMsg('f-msg', 'Дата публикации: формат ДД.ММ.ГГГГ ЧЧ:ММ', true);
      }
      showMsg('f-msg', saveDraftFlag ? '⏳ Сохраняю…' : '⏳ Отправляю пост в чат…');
      POST('/app/api/giveaways/create', body).then(function (d) {
        if (!d.ok) return showMsg('f-msg', '⚠️ ' + (d.error || 'Ошибка'), true);
        if (saveDraftFlag) {
          clearDraft(DRAFT_GW_KEY);
          showMsg('f-msg', '✅ Черновик сохранён');
          setTimeout(renderHome, 1200);
          return;
        }
        // Пост ушёл в чат на утверждение: открываем чат MAX.
        showMsg('f-msg', '✅ Пост отправлен в чат — утвердите его в MAX (Да/Нет)');
        var after = document.getElementById('wz-after');
        after.innerHTML = '<button class="btn" id="wz-openchat">💬 Открыть чат с ботом</button>';
        document.getElementById('wz-openchat').onclick = function () {
          try { if (api.openMaxLink) api.openMaxLink('https://max.ru/'); } catch (e) {}
        };
        try { if (api.openMaxLink) api.openMaxLink('https://max.ru/'); } catch (e) {}
      });
    }
    if (go) go.onclick = function () { submit(false); };
    if (dr) dr.onclick = function () { submit(true); };
  }

  // hydrateWizardFromServer — черновик с сервера → драфт визарда (редактура).
  // Шаг ставим на «Пост» (3): название/каналы/ссылки уже выбраны, правят пост/прочее.
  function hydrateWizardFromServer(g) {
    if (!g) return;
    var d = loadDraft(DRAFT_GW_KEY) || {};
    // Без названия — начинаем с «Название» (сразу введёт, ссылки переименуются).
    d.step = (g.name || '') ? 3 : 0;
    d.giveaway_id = g.giveaway_id;
    d['f-post'] = g.post_text || '';
    d['f-name'] = g.name || '';
    d['f-btn'] = g.button_text || 'Участвовать';
    d['f-winners'] = String(g.winners || 1);
    d['f-finat'] = g.finish_at || '';
    d['f-fincnt'] = String(g.finish_count || '');
    d['f-pubat'] = g.publish_at || '';
    d['f-winmsg'] = g.winners_message || '';
    d.pub_channels = g.pub_channels || [];
    d.sub_channels = g.sub_channels || [];
    d.finish_mode = g.finish_mode === 'count' ? 'count' : 'time';
    d.publish_mode = g.publish_now ? 'now' : 'at';
    d.captcha = !!g.captcha;
    d.referral = !!g.referral;
    d.results_in_post = !!g.results_in_post;
    d.media_tokens = g.media_tokens || [];
    d.links = (g.links || []).map(function (l) { return { url: l.url, name: l.name, channel_id: l.channel_id }; });
    saveDraft(DRAFT_GW_KEY, d);
    renderGwWizard(0); // резюм перепрыгнет на сохранённый шаг
  }

  // Форматирование выделения в textarea (Markdown MAX: *b*, _i_, ~s~, [t](url)).
  function wrapSel(areaId, kind) {
    var el = document.getElementById(areaId); if (!el) return;
    var s = el.selectionStart, e = el.selectionEnd, v = el.value, sel = v.slice(s, e);
    var out;
    if (kind === 'a') {
      // Ссылка — строкой ввода под панелью (prompt() в вебвью MAX недоступен).
      var bar = document.getElementById('f-linkbar');
      if (bar) {
        bar.classList.remove('hidden');
        var inp = document.getElementById('f-linkurl');
        inp.value = '';
        inp.placeholder = sel ? 'https://… — на «' + sel.slice(0, 24) + '»' : 'https://…';
        try { inp.focus(); } catch (e0) {}
      }
      return;
    } else {
      var m = { b: '**', i: '_', s: '~~' }[kind];
      // Тоггл: если уже обёрнуто — снять.
      if (v.slice(s - m.length, s) === m && v.slice(e, e + m.length) === m) {
        el.value = v.slice(0, s - m.length) + sel + v.slice(e + m.length);
        el.selectionStart = s - m.length; el.selectionEnd = e - m.length; el.focus(); el.dispatchEvent(new Event('input')); return;
      }
      if (sel.slice(0, m.length) === m && sel.slice(-m.length) === m) sel = sel.slice(m.length, -m.length);
      out = m + sel + m;
    }
    el.value = v.slice(0, s) + out + v.slice(e);
    el.selectionStart = s; el.selectionEnd = s + out.length; el.focus();
    el.dispatchEvent(new Event('input'));
  }

  function segBind(id, cb) {
    document.querySelectorAll('#' + id + ' .chip').forEach(function (c) {
      c.onclick = function () {
        document.querySelectorAll('#' + id + ' .chip').forEach(function (x) { x.classList.remove('on'); });
        c.classList.add('on');
        if (cb) cb(c.getAttribute('data-v'));
      };
    });
  }
  function segVal(id) { var on = document.querySelector('#' + id + ' .chip.on'); return on ? on.getAttribute('data-v') : ''; }
  function segSet(id, v) {
    document.querySelectorAll('#' + id + ' .chip').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-v') === v); });
    if (v === 'count' && document.getElementById('f-fintime')) { document.getElementById('f-fintime').classList.add('hidden'); document.getElementById('f-fincount').classList.remove('hidden'); }
    if (v === 'at' && document.getElementById('f-pubat-w')) document.getElementById('f-pubat-w').classList.remove('hidden');
  }
  function toggleBind(id) { var el = document.getElementById(id); if (el) el.onclick = function () { el.classList.toggle('on'); }; }
  function chipOnEl(id) { var el = document.getElementById(id); return el ? el.classList.contains('on') : null; }
  function chipOff(id) { var el = document.getElementById(id); if (el) el.classList.remove('on'); }
  function chipOn2(id) { var el = document.getElementById(id); if (el) el.classList.add('on'); }
  function showMsg(id, text, isErr) {
    var el = document.getElementById(id);
    if (el) { el.textContent = text; el.className = 'msg ' + (isErr ? 'err' : 'ok'); }
  }
  // Дата-хелперы: форматирование, проверка ДД.ММ.ГГГГ ЧЧ:ММ и живое поле
  // (текстовый ввод без системного пикера — в вебвью MAX его скролл
  // ненадёжен; быстрые чипы закрывают типовые случаи одним тапом).
  function fmtDT(d) {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function dateOK(v) {
    var m = /^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})$/.exec(v || '');
    if (!m) return false;
    var d = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]);
    return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 &&
           d.getHours() === +m[4] && d.getMinutes() === +m[5];
  }
  function bindDateField(inpId, hintId) {
    var inp = document.getElementById(inpId), hint = document.getElementById(hintId);
    if (!inp) return;
    function show() {
      if (!hint) return;
      if (!inp.value) { hint.textContent = ''; return; }
      var ok = dateOK(inp.value);
      hint.textContent = ok ? '✓ дата распознана' : '✗ формат ДД.ММ.ГГГГ ЧЧ:ММ';
      hint.style.color = ok ? 'var(--muted)' : '#c66';
    }
    inp.addEventListener('input', show);
    show();
    inp.parentElement.querySelectorAll('[data-dd]').forEach(function (c) {
      c.onclick = function () {
        var d;
        if (c.getAttribute('data-h') === 'now') d = new Date(Date.now() + 3600000);
        else {
          d = new Date();
          d.setDate(d.getDate() + parseInt(c.getAttribute('data-dd'), 10));
          d.setHours(parseInt(c.getAttribute('data-h'), 10), 0, 0, 0);
        }
        inp.value = fmtDT(d);
        inp.dispatchEvent(new Event('input'));
      };
    });
  }
  function defaultFinish() {
    var d = new Date(); d.setDate(d.getDate() + 1);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' 21:00';
  }
