<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитика — RandoMaster</title>
<script src="https://st.max.ru/js/max-web-app.js"></script>
<style>
  :root {
    --bg:#0f1420; --card:#1a2235; --card2:#212b42; --accent:#7c5cff; --accent2:#5cffb3;
    --err:#ff6b7a; --text:#e8ecf5; --muted:#8b93a7; --line:#2a3550;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
         min-height:100vh; padding:14px 12px 40px; }
  .hidden { display:none !important; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header .back { width:36px; height:36px; border-radius:10px; background:var(--card);
                 border:none; color:var(--text); font-size:18px; cursor:pointer; flex:none; }
  header h1 { font-size:18px; font-weight:700; }
  header .sub { font-size:12px; color:var(--muted); }
  .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;
          transition:background .15s; border:1px solid transparent; }
  .card:active { background:var(--card2); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .title { font-size:15px; font-weight:600; }
  .card .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .badge { font-size:10px; padding:2px 8px; border-radius:99px; background:rgba(124,92,255,.15);
           color:var(--accent); flex:none; }
  .badge.pub { background:rgba(92,255,179,.12); color:var(--accent2); }
  .badge.contest { background:rgba(255,200,90,.15); color:#ffc85a; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .stat { background:rgba(255,255,255,.04); border-radius:10px; padding:8px; text-align:center; }
  .stat .num { font-size:17px; font-weight:700; }
  .stat .lbl { font-size:10px; color:var(--muted); margin-top:2px; }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px; }
  .chip { flex:none; padding:7px 14px; border-radius:99px; background:var(--card); color:var(--muted);
          font-size:13px; border:1px solid var(--line); cursor:pointer; }
  .chip.on { background:rgba(124,92,255,.18); color:var(--accent); border-color:rgba(124,92,255,.4); }
  .chart { width:100%; height:120px; margin-top:6px; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:110px; margin-top:10px; }
  .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; min-width:4px; }
  .bar .j { background:var(--accent); border-radius:2px 2px 0 0; }
  .bar .u { background:var(--err); border-radius:0 0 2px 2px; opacity:.75; }
  .xaxis { display:flex; gap:2px; margin-top:4px; }
  .xaxis span { flex:1; text-align:center; font-size:8px; color:var(--muted); min-width:4px; overflow:hidden; }
  .skel { height:70px; border-radius:14px; background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
          background-size:200% 100%; animation:sk 1.2s infinite; margin-bottom:10px; }
  @keyframes sk { to { background-position:-200% 0; } }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; font-size:14px; }
  .users { margin-top:8px; }
  .user { display:flex; justify-content:space-between; padding:9px 10px; background:rgba(255,255,255,.03);
          border-radius:10px; margin-bottom:6px; font-size:13px; }
  .user .st { font-size:11px; color:var(--muted); }
  .user .st.in { color:var(--accent2); }
  .user .st.out { color:var(--err); }
  .linkline { font-size:11px; color:var(--muted); word-break:break-all; margin-top:4px; }
  .sect { font-size:13px; font-weight:600; margin:16px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
</style>
</head>
<body>
  <div id="app">
    <div class="skel"></div><div class="skel"></div><div class="skel" style="height:110px"></div>
  </div>
<script>
// Мини-апп аналитики (rev 13.11): каналы → ссылки (сорт/фильтр) → детально;
// динамика подписок/отписок графиком. Авторизация — подпись init_data.
(function () {
  var api = window.WebApp || {};
  try { api.ready && api.ready(); } catch (e) {}
  var initData = (api.initData || '') || new URLSearchParams(location.search).get('init_data') || '';
  var backBtn = api.BackButton;

  var app = document.getElementById('app');
  var state = { view: 'channels', channels: [], sort: 'date', filter: 'all', dynDays: 14, gwSort: 'date', gwFilter: 'all' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function GET(path) {
    return fetch(path + (path.indexOf('?') > -1 ? '&' : '?') + 'init_data=' + encodeURIComponent(initData))
      .then(function (r) { if (!r.ok) throw 0; return r.json(); });
  }
  function header(title, sub, canBack) {
    return '<header>' +
      (canBack ? '<button class="back" id="hb">←</button>' : '') +
      '<div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>' +
      '</header>';
  }
  function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) + '%' : '—'; }

  // ---------- Экран 1: каналы ----------
  function tabs(cur) {
    return '<div class="toolbar" style="margin-bottom:10px">' +
      '<div class="chip ' + (cur === 'an' ? 'on' : '') + '" data-a="tab-an">📊 Аналитика</div>' +
      '<div class="chip ' + (cur === 'gw' ? 'on' : '') + '" data-a="tab-gw">🎁 Розыгрыши</div>' +
      '</div>';
  }

  function renderGiveaways() {
    state.view = 'giveaways';
    if (backBtn) backBtn.hide();
    app.innerHTML = header('🎁 Розыгрыши', 'посты, черновики, статистика') +
      tabs('gw') +
      '<div class="toolbar">' +
      '<div class="chip ' + (state.gwSort === 'date' ? 'on' : '') + '" data-a="gwsort-date">Новые сверху</div>' +
      '<div class="chip ' + (state.gwSort === 'name' ? 'on' : '') + '" data-a="gwsort-name">По имени</div>' +
      '<span style="flex:1"></span>' +
      ['all','draft','scheduled','active','finished'].map(function (f) {
        return '<div class="chip ' + (state.gwFilter === f ? 'on' : '') + '" data-a="gwfilter-' + f + '">' +
          ({ all:'Все', draft:'📝 Черновики', scheduled:'📅 Запланированные', active:'🟢 Идут', finished:'🏁 Завершённые' })[f] + '</div>';
      }).join('') +
      '</div><div id="list"><div class="skel"></div><div class="skel"></div></div>';
    bindToolbar();
    GET('/app/api/analytics/giveaways').then(function (d) {
      var gws = d.giveaways || [];
      if (state.gwSort === 'name') {
        gws.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });
      }
      if (state.gwFilter !== 'all') {
        gws = gws.filter(function (g) { return g.status === state.gwFilter; });
      }
      var stMeta = { draft:['📝','черновик'], scheduled:['📅','запланирован'], active:['🟢','идёт'], finished:['🏁','завершён'], cancelled:['✖','отменён'] };
      var html = gws.map(function (g) {
        var m = stMeta[g.status] || ['', g.status];
        return '<div class="card" data-a="gw" data-id="' + g.id + '">' +
          '<div class="row"><div class="title">' + m[0] + ' ' + esc(g.name) + '</div>' +
          '<span class="badge">' + m[1] + '</span></div>' +
          '<div class="meta">' + esc(g.when) + ' · участников: ' + g.parts + ' · победителей: ' + g.winners + '</div>' +
          '</div>';
      }).join('');
      document.getElementById('list').innerHTML = html ||
        '<div class="empty">Розыгрышей этого типа нет.<br>Создайте в боте: «Создать 🎲»</div>';
      app.querySelectorAll('.card[data-a="gw"]').forEach(function (c) {
        c.onclick = function () {
          var g = gws.filter(function (x) { return String(x.id) === c.getAttribute('data-id'); })[0];
          if (g) renderGiveaway(g);
        };
      });
    }).catch(function () {
      document.getElementById('list').innerHTML = '<div class="empty">Не удалось загрузить.</div>';
    });
  }

  function renderGiveaway(g) {
    state.view = 'giveaway';
    if (backBtn) backBtn.show();
    app.innerHTML = header(g.name, 'розыгрыш', true) +
      '<div class="card" style="cursor:default">' +
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + g.parts + '</div><div class="lbl">участников</div></div>' +
      '<div class="stat"><div class="num">' + g.winners + '</div><div class="lbl">победителей</div></div>' +
      '<div class="stat"><div class="num" style="font-size:12px;padding-top:6px">' + esc(g.when) + '</div><div class="lbl">' + esc(g.status) + '</div></div>' +
      '</div></div>' +
      '<div class="card" data-a="sendpost" data-id="' + g.id + '">' +
      '<div class="row"><div class="title">📤 Отправить пост мне в чат</div><span>→</span></div>' +
      '<div class="meta">готовый пост точным видом (текст, медиа, кнопка)</div>' +
      '</div>' +
      '<div id="sendmsg" class="meta" style="text-align:center;margin-top:6px"></div>';
    if (backBtn) backBtn.onClick(function () { renderGiveaways(); });
    var hb = document.getElementById('hb');
    if (hb) hb.onclick = function () { renderGiveaways(); };
    var sp = app.querySelector('.card[data-a="sendpost"]');
    if (sp) sp.onclick = function () {
      sp.querySelector('.title').textContent = '⏳ Отправляю…';
      fetch('/app/api/analytics/send-post?init_data=' + encodeURIComponent(initData), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ giveaway_id: parseInt(g.id, 10) })
      }).then(function (r) { return r.json(); }).then(function (d) {
        document.getElementById('sendmsg').textContent =
          d.ok ? '✅ Пост отправлен — проверьте чат с ботом' : '⚠️ ' + (d.error || 'не удалось отправить');
        sp.querySelector('.title').textContent = '📤 Отправить пост мне в чат';
      }).catch(function () {
        document.getElementById('sendmsg').textContent = '⚠️ Ошибка сети';
        sp.querySelector('.title').textContent = '📤 Отправить пост мне в чат';
      });
    };
  }

  function renderChannels() {
    state.view = 'channels';
    if (backBtn) backBtn.hide();
    app.innerHTML = header('📊 Аналитика', 'каналы и трекинг-ссылки') + tabs('an') +
      '<div class="toolbar">' +
      '<div class="chip ' + (state.sort === 'date' ? 'on' : '') + '" data-a="sort-date">Новые сверху</div>' +
      '<div class="chip ' + (state.sort === 'name' ? 'on' : '') + '" data-a="sort-name">По имени</div>' +
      '</div><div id="list"><div class="skel"></div><div class="skel"></div></div>';
    bindToolbar();
    GET('/app/api/analytics/channels').then(function (d) {
      var chs = d.channels || [];
      if (state.sort === 'name') {
        chs.sort(function (a, b) { return a.title.localeCompare(b.title, 'ru'); });
      }
      var html = chs.map(function (c) {
        return '<div class="card" data-a="ch" data-id="' + c.id + '">' +
          '<div class="row"><div class="title">' + esc(c.title) + '</div>' +
          '<span class="badge ' + (c.is_public ? 'pub' : '') + '">' + (c.is_public ? 'публичный' : 'приватный') + '</span></div>' +
          '<div class="meta">ссылок: ' + c.links + ' · добавлен ' + esc(c.added_at) + '</div>' +
          '<div class="stats">' +
          '<div class="stat"><div class="num">' + fmt(c.clicks) + '</div><div class="lbl">клики</div></div>' +
          '<div class="stat"><div class="num">' + fmt(c.signups) + '</div><div class="lbl">подписки</div></div>' +
          '<div class="stat"><div class="num">' + pct(c.signups, c.clicks) + '</div><div class="lbl">конверсия</div></div>' +
          '</div></div>';
      }).join('');
      document.getElementById('list').innerHTML = html ||
        '<div class="empty">Каналов пока нет.<br>Добавьте канал в боте: «Мои каналы → ➕»</div>';
      bindCards();
    }).catch(function () {
      document.getElementById('list').innerHTML = '<div class="empty">Не удалось загрузить. Обновите страницу.</div>';
    });
  }

  // ---------- Экран 2: ссылки канала + динамика ----------
  function renderChannel(id, title) {
    state.view = 'channel'; state.chID = id; state.chTitle = title;
    if (backBtn) backBtn.show();
    app.innerHTML = header(title || 'Канал', 'ссылки и динамика', true) +
      '<div class="toolbar">' +
      '<div class="chip ' + (state.sort === 'date' ? 'on' : '') + '" data-a="sort-date">Новые сверху</div>' +
      '<div class="chip ' + (state.sort === 'name' ? 'on' : '') + '" data-a="sort-name">По имени</div>' +
      '<span style="flex:1"></span>' +
      '<div class="chip" data-a="dyn-14">14д</div>' +
      '<div class="chip" data-a="dyn-30">30д</div>' +
      '</div>' +
      '<div class="toolbar">' +
      ['all', 'unique', 'super', 'contest'].map(function (f) {
        return '<div class="chip ' + (state.filter === f ? 'on' : '') + '" data-a="filter-' + f + '">' +
          ({ all: 'Все', unique: '🔗 Уникальные', super: '⚡ Супер', contest: '🏁 Конкурсные' })[f] + '</div>';
      }).join('') +
      '</div><div id="dyn"></div><div class="sect">Ссылки</div><div id="list">' +
      '<div class="skel"></div><div class="skel"></div></div>';
    bindToolbar();
    if (backBtn) { backBtn.onClick(function () { renderChannels(); }); }
    var hb = document.getElementById('hb');
    if (hb) hb.onclick = function () { renderChannels(); };

    GET('/app/api/analytics/channel/' + id + '&sort=' + (state.sort === 'name' ? 'name' : 'date'))
      .then(function (d) {
        // Динамика: график 14/30 дней.
        var dyn = d.dynamics || [];
        var days = state.dynDays;
        dyn = dyn.slice(-days);
        renderDynamics(dyn, days);
        // Ссылки.
        var links = d.links || [];
        if (state.filter !== 'all') {
          links = links.filter(function (l) { return l.type === state.filter; });
        }
        var typeMeta = {
          unique: ['🔗', 'уникальная', ''],
          super: ['⚡', 'суперссылка', 'на пост'],
          contest: ['🏁', 'конкурсная', '']
        };
        var html = links.map(function (l) {
          var m = typeMeta[l.type] || ['🔗', '', ''];
          return '<div class="card" data-a="link" data-id="' + l.id + '">' +
            '<div class="row"><div class="title">' + m[0] + ' ' + esc(l.name) + '</div>' +
            '<span class="badge ' + (l.type === 'contest' ? 'contest' : '') + '">' + m[1] + '</span></div>' +
            (l.post_ref ? '<div class="linkline">⚡ ' + esc(l.post_ref) + '</div>' : '') +
            '<div class="stats">' +
            '<div class="stat"><div class="num">' + fmt(l.clicks) + '</div><div class="lbl">клики</div></div>' +
            '<div class="stat"><div class="num">' + fmt(l.signups) + '</div><div class="lbl">подписки</div></div>' +
            '<div class="stat"><div class="num">' + fmt(l.still_in) + '</div><div class="lbl">остались</div></div>' +
            '</div></div>';
        }).join('');
        document.getElementById('list').innerHTML = html ||
          '<div class="empty">Ссылок этого типа нет.<br>Создайте в боте: «Трекинг»</div>';
        bindCards();
      }).catch(function () {
        document.getElementById('list').innerHTML = '<div class="empty">Не удалось загрузить.</div>';
      });
  }

  function renderDynamics(dyn, days) {
    var el = document.getElementById('dyn');
    if (!dyn || !dyn.length) { el.innerHTML = ''; return; }
    var maxJ = 1;
    dyn.forEach(function (d) { if (d.Joins > maxJ) maxJ = d.Joins; if (d.Unsubs > maxJ) maxJ = d.Unsubs; });
    var bars = dyn.map(function (d) {
      var hJ = Math.round(d.Joins / maxJ * 90);
      var hU = Math.round(d.Unsubs / maxJ * 90);
      return '<div class="bar" title="' + d.Day + ': +' + d.Joins + ' / −' + d.Unsubs + '">' +
        '<div class="j" style="height:' + Math.max(hJ, d.Joins > 0 ? 3 : 0) + 'px"></div>' +
        '<div class="u" style="height:' + Math.max(hU, d.Unsubs > 0 ? 3 : 0) + 'px"></div></div>';
    }).join('');
    var labels = dyn.map(function (d, i) {
      var show = dyn.length <= 14 ? i % 2 === 0 : i % 5 === 0;
      return '<span>' + (show ? d.Day.slice(0, 5) : '') + '</span>';
    }).join('');
    var totJ = 0, totU = 0;
    dyn.forEach(function (d) { totJ += d.Joins; totU += d.Unsubs; });
    el.innerHTML = '<div class="card" style="cursor:default">' +
      '<div class="row"><div class="title">Динамика, ' + days + ' дней</div>' +
      '<div class="meta" style="margin:0">＋' + totJ + ' <span style="opacity:.6">|</span> −' + totU + '</div></div>' +
      '<div class="bars">' + bars + '</div>' +
      '<div class="xaxis">' + labels + '</div>' +
      '<div class="meta" style="margin-top:6px">🟪 подписки · 🟥 отписки (МСК)</div>' +
      '</div>';
  }

  // ---------- Экран 3: детально по ссылке ----------
  function renderLink(id) {
    state.view = 'link';
    if (backBtn) backBtn.show();
    app.innerHTML = header('Ссылка', '', true) + '<div id="body"><div class="skel"></div><div class="skel"></div></div>';
    if (backBtn) backBtn.onClick(function () { renderChannel(state.chID, state.chTitle); });
    var hb = document.getElementById('hb');
    if (hb) hb.onclick = function () { renderChannel(state.chID, state.chTitle); };

    GET('/app/api/analytics/link/' + id).then(function (d) {
      var l = d.link || {}, r = d.retention || {};
      document.querySelector('header .sub').textContent = l.Source || '';
      var cpaD = '—', cpaC = '—';
      if (l.Cost > 0 && r.Subscribed > 0) cpaD = (l.Cost / r.Subscribed).toFixed(1) + ' ₽';
      if (l.Cost > 0 && r.StillIn > 0) cpaC = (l.Cost / r.StillIn).toFixed(1) + ' ₽';
      var users = (d.subscribers || []).map(function (u) {
        var st = u.UnsubscribedAt ? '<span class="st out">отписался ' + esc(u.UnsubscribedAt) + '</span>'
                                  : '<span class="st in">подписан</span>';
        var wm = u.WasMember ? ' · был участником' : '';
        return '<div class="user"><div>' + esc(u.FirstName || ('#' + u.UserID)) +
          (u.Username ? ' @' + esc(u.Username) : '') + '<div class="st">' + esc(u.SubscribedAt) + wm + '</div></div>' + st + '</div>';
      }).join('');
      var clickersNoSub = (d.clickers || []).filter(function (c) {
        return !(d.subscribers || []).some(function (s) { return s.UserID === c.UserID; });
      }).map(function (c) {
        return '<div class="user"><div>' + esc(c.FirstName || ('#' + c.UserID)) +
          (c.Username ? ' @' + esc(c.Username) : '') + '</div><span class="st">клик ' + esc(c.ClickedAt) + ' · не подписался</span></div>';
      }).join('');

      document.getElementById('body').innerHTML =
        '<div class="card" style="cursor:default">' +
        '<div class="stats" style="grid-template-columns:repeat(3,1fr)">' +
        '<div class="stat"><div class="num">' + fmt(l.Clicks) + '</div><div class="lbl">клики</div></div>' +
        '<div class="stat"><div class="num">' + fmt(l.Signups) + '</div><div class="lbl">подписки</div></div>' +
        '<div class="stat"><div class="num">' + fmt(r.StillIn) + '</div><div class="lbl">остались</div></div>' +
        '</div>' +
        '<div class="stats" style="margin-top:8px">' +
        '<div class="stat"><div class="num">' + pct(l.Signups, l.Clicks) + '</div><div class="lbl">конверсия</div></div>' +
        '<div class="stat"><div class="num">' + cpaD + '</div><div class="lbl">CPA грязный</div></div>' +
        '<div class="stat"><div class="num">' + cpaC + '</div><div class="lbl">CPA чистый</div></div>' +
        '</div>' +
        (l.PostRef ? '<div class="linkline">⚡ ' + esc(l.PostRef) + '</div>' : '') +
        '</div>' +
        '<div class="card" style="cursor:default">' +
        '<div class="title" style="margin-bottom:8px">Удержание</div>' +
        '<div class="stats" style="grid-template-columns:repeat(5,1fr)">' +
        ['1д', '3д', '7д', '14д', '30д'].map(function (k, i) {
          var v = [r.Retained1d, r.Retained3d, r.Retained7d, r.Retained14d, r.Retained30d][i];
          return '<div class="stat"><div class="num">' + v + '</div><div class="lbl">' + k + '</div></div>';
        }).join('') +
        '</div><div class="meta" style="margin-top:6px">из ' + r.Subscribed + ' подписавшихся' +
        (r.WasMemberAtClick ? ' · уже были участниками: ' + r.WasMemberAtClick : '') + '</div>' +
        '</div>' +
        '<div class="sect">Подписчики (' + (d.subscribers || []).length + ')</div>' +
        '<div class="users">' + (users || '<div class="empty" style="padding:16px">Пока никто</div>') + '</div>' +
        (clickersNoSub ? '<div class="sect">Кликнули, но не подписались (' + clickersNoSub.split('class="user"').length - 1 + ')</div>' +
          '<div class="users">' + clickersNoSub + '</div>' : '');
    }).catch(function () {
      document.getElementById('body').innerHTML = '<div class="empty">Не удалось загрузить.</div>';
    });
  }

  // ---------- события ----------
  function bindToolbar() {
    app.querySelectorAll('.chip').forEach(function (c) {
      c.onclick = function () {
        var a = c.getAttribute('data-a') || '';
        if (a === 'sort-date') { state.sort = 'date'; refresh(); }
        else if (a === 'sort-name') { state.sort = 'name'; refresh(); }
        else if (a.indexOf('filter-') === 0) { state.filter = a.slice(7); refresh(); }
        else if (a === 'dyn-14') { state.dynDays = 14; refresh(); }
        else if (a === 'dyn-30') { state.dynDays = 30; refresh(); }
        else if (a === 'tab-an') { renderChannels(); }
        else if (a === 'tab-gw') { renderGiveaways(); }
        else if (a === 'gwsort-date') { state.gwSort = 'date'; renderGiveaways(); }
        else if (a === 'gwsort-name') { state.gwSort = 'name'; renderGiveaways(); }
        else if (a.indexOf('gwfilter-') === 0) { state.gwFilter = a.slice(9); renderGiveaways(); }
      };
    });
  }
  function bindCards() {
    app.querySelectorAll('.card[data-a]').forEach(function (c) {
      c.onclick = function () {
        var id = c.getAttribute('data-id');
        if (c.getAttribute('data-a') === 'ch') renderChannel(id, c.querySelector('.title').textContent);
        else if (c.getAttribute('data-a') === 'link') renderLink(id);
      };
    });
  }
  function refresh() {
    if (state.view === 'channels') renderChannels();
    else if (state.view === 'channel') renderChannel(state.chID, state.chTitle);
    else if (state.view === 'link') renderLink(location.hash.slice(3) || state.linkID);
  }

  renderChannels();
})();
</script>
</body>
</html>
